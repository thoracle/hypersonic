<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>game: real-time landscape + lock-on targeting</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307090c'/><path d='M16 4 L27 28 L16 22 L5 28 Z' fill='%2333ff55'/></svg>">
<style>
  /* the arcade typeface: Press Start 2P (SIL OFL, vendored) — a real 8-bit
     cabinet face on everything the PLAYER reads. The dev HUD and the
     evolution pips stay ui-monospace: PS2P runs ~1.4x wider per glyph and
     carries no geometric-shape coverage. */
  @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;
    src:url('static/vendor/PressStart2P-Regular.ttf') format('truetype');
    font-display:block}
  html,body{margin:0;height:100%;background:#010402;overflow:hidden;font-family:ui-monospace,monospace;cursor:none;
    user-select:none;-webkit-user-select:none}   /* macOS force-click Look Up needs selectable text — deny it */
  canvas{touch-action:none}
  #picker{position:fixed;inset:0;z-index:5;display:none;align-items:center;
    justify-content:center;flex-direction:column;gap:10px;background:#010402dd;cursor:auto}
  #picker h1{color:#33ff55;font-size:18px;letter-spacing:0.12em;font-weight:400;
    text-shadow:0 0 12px #33ff55;margin:0 0 22px;
    font-family:'Press Start 2P',ui-monospace,monospace}
  #picker button{background:#00000088;color:#33ff55;border:1px solid #33ff5566;
    padding:14px 30px;cursor:pointer;font-size:11px;
    font-family:'Press Start 2P',ui-monospace,monospace;
    letter-spacing:0.04em;min-width:370px;line-height:1.4}
  #picker button:hover{background:#33ff55;color:#010402;text-shadow:none}
  /* live tuning panel (` toggles, ?tune=1 opens at start) — a DEV surface, so
     it stays ui-monospace and out of the cabinet type entirely */
  #tune{position:fixed;top:8px;left:8px;z-index:9;display:none;cursor:auto;
    max-height:94vh;overflow-y:auto;background:#010402ee;color:#33ff55;
    border:1px solid #33ff5566;padding:8px 10px;font-size:10px;line-height:1.5;
    width:290px;text-shadow:none}
  #tune h2{margin:6px 0 3px;font-size:9px;letter-spacing:0.14em;color:#9fe8ff;
    font-weight:400;border-bottom:1px solid #33ff5533;padding-bottom:2px}
  #tune h2:first-child{margin-top:0}
  #tune .row{display:grid;grid-template-columns:104px 1fr 46px;align-items:center;gap:5px}
  #tune .row.dirty label{color:#ffd76a}
  #tune label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tune input[type=range]{width:100%;accent-color:#33ff55;height:12px}
  #tune .val{text-align:right;font-variant-numeric:tabular-nums;color:#eaffef}
  #tune .btns{display:flex;gap:6px;margin-top:8px}
  #tune button{flex:1;background:#00000088;color:#33ff55;border:1px solid #33ff5566;
    padding:5px 0;cursor:pointer;font:inherit}
  #tune button:hover{background:#33ff55;color:#010402}
  #tune .note{color:#8fc4c6;margin-top:6px}
  #hud{position:fixed;bottom:8px;left:12px;color:#33ff55;font-size:11px;line-height:1.5;z-index:2;white-space:pre;text-shadow:0 0 3px #062}
  /* the run readout sits LOWER RIGHT (user call) so the upper right can
     carry the music orb, mirroring the radar in the upper left */
  #score{position:fixed;bottom:10px;right:12px;color:#33ff55;font-size:10px;z-index:2;
    text-shadow:0 0 8px #33ff55;text-align:right;white-space:pre;line-height:2.0;
    font-family:'Press Start 2P',ui-monospace,monospace;pointer-events:none}
  #viz{position:fixed;top:12px;right:12px;z-index:2;pointer-events:none}
  #bigscore{position:fixed;top:42px;left:50%;transform:translateX(-50%);z-index:2;
    font-family:'Press Start 2P',ui-monospace,monospace;
    font-size:30px;font-weight:400;letter-spacing:0.04em;
    color:#eaffef;text-shadow:0 0 6px #33ff55,0 0 18px #33ff55,0 2px 0 #063;
    font-variant-numeric:tabular-nums;pointer-events:none}
  #shield{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:2;
    width:280px;height:10px;border-radius:5px;pointer-events:none;
    background:#00000066;border:1px solid #33ff5566}
  #shieldfill{height:100%;width:100%;border-radius:4px;background:#33ff55;
    box-shadow:0 0 8px #33ff55;transition:width 0.12s,background 0.2s}
  #lvl{position:fixed;top:114px;left:50%;transform:translateX(-50%);z-index:2;
    font-size:12px;letter-spacing:0.55em;pointer-events:none}
  #lvl span{color:#173423}
  #lvl span.on{color:#33ff55;text-shadow:0 0 8px #33ff55}
  #od{position:fixed;top:134px;left:50%;transform:translateX(-50%);z-index:2;
    font-size:11px;letter-spacing:0.5em;pointer-events:none}
  #od span{color:#3a1018}
  #od span.on{color:#ff3355;text-shadow:0 0 8px #ff3355}
  #dmg{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 120px 40px #ff2222}
  #radar{position:fixed;top:12px;left:12px;z-index:2;pointer-events:none}
  #touchui{display:none}
  body.touchon #touchui{display:block}
  body.touchon #hud{display:none}   /* dev text has no place under a thumb */
  #joy,#fireBtn,#odBtn{position:fixed;z-index:4;border-radius:50%;
    background:#03170a88;border:2px solid #33ff5588;color:#33ff55;
    font-family:'Press Start 2P',ui-monospace,monospace;
    letter-spacing:0.04em;touch-action:none;padding:0;
    -webkit-user-select:none;user-select:none;cursor:pointer}
  #joy{left:calc(26px + env(safe-area-inset-left));
    bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px}
  #joyknob{position:absolute;left:50%;top:50%;width:52px;height:52px;
    margin:-26px 0 0 -26px;border-radius:50%;background:#33ff5533;
    border:2px solid #33ff55;box-shadow:0 0 12px #33ff5566;pointer-events:none}
  #fireBtn{right:calc(26px + env(safe-area-inset-right));
    bottom:calc(30px + env(safe-area-inset-bottom));width:106px;height:106px;
    font-size:11px;text-shadow:0 0 8px #33ff55}
  #odBtn{right:calc(52px + env(safe-area-inset-right));
    bottom:calc(156px + env(safe-area-inset-bottom));width:58px;height:58px;
    font-size:9px}
  .hitedge{position:fixed;z-index:3;pointer-events:none;opacity:0}
  #hitL{left:0;top:0;bottom:0;width:16%;
    background:linear-gradient(90deg,#ff2222cc,transparent)}
  #hitR{right:0;top:0;bottom:0;width:16%;
    background:linear-gradient(270deg,#ff2222cc,transparent)}
  #hitT{top:0;left:0;right:0;height:18%;
    background:linear-gradient(180deg,#ff2222cc,transparent)}
  #hitB{bottom:0;left:0;right:0;height:18%;
    background:linear-gradient(0deg,#ff2222cc,transparent)}
  #over{position:fixed;inset:0;z-index:4;display:none;align-items:center;
    justify-content:center;flex-direction:column;gap:26px;background:#010402;
    text-align:center;cursor:pointer;font-weight:bold;letter-spacing:0.1em}
  #over::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0 2px,#00000059 2px 4px)}
  #over>*{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400}
  #overtitle{font-size:26px;letter-spacing:0.06em;color:#ff5544;line-height:1.4;
    text-shadow:0 0 14px #ff3322,0 0 44px #ff222244}
  #overbig{font-size:52px;letter-spacing:0.02em;color:#eaffef;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 10px #33ff55,0 0 36px #33ff55}
  #overrec{font-size:12px;letter-spacing:0.12em;color:#ffd76a;
    text-shadow:0 0 12px #ffaa22;animation:blink 0.9s step-end infinite}
  #overstats{font-size:10px;letter-spacing:0.06em;color:#8fc4c6;line-height:2;
    text-shadow:0 0 6px #33ff5588}
  #overgo{font-size:10px;letter-spacing:0.1em;color:#eaffef;
    text-shadow:0 0 8px #33ff55;animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  #hiscore{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:2;
    font-family:'Press Start 2P',ui-monospace,monospace;
    font-size:9px;letter-spacing:0.08em;color:#8fc4c6;
    text-shadow:0 0 6px #33ff5588;pointer-events:none}
  #hstable{font-size:12px;letter-spacing:0.04em;line-height:2.3;
    color:#7ddb92;white-space:pre;text-shadow:0 0 8px #33ff5566}
  #hstable .new{color:#ffd76a;text-shadow:0 0 10px #ffaa22}
  #hstable .hd{color:#33ff55;font-size:9px;letter-spacing:0.12em;
    text-shadow:0 0 8px #33ff55}
  canvas{display:block}
</style>
</head>
<body>
<div id="picker"><h1>SELECT TRACK</h1></div>
<div id="tune"></div>
<div id="hud">select a track</div><div id="score"></div><div id="bigscore">0</div>
<div id="shield"><div id="shieldfill"></div></div>
<div id="lvl"></div><div id="od"></div>
<div id="dmg"></div>
<canvas id="radar" width="160" height="160"></canvas>
<canvas id="viz" width="160" height="160"></canvas>
<div id="hitL" class="hitedge"></div><div id="hitR" class="hitedge"></div>
<div id="hitT" class="hitedge"></div><div id="hitB" class="hitedge"></div>
<div id="touchui"><button id="joy"><div id="joyknob"></div></button>
<button id="fireBtn">FIRE</button><button id="odBtn">OD</button></div>
<div id="over">
  <span id="overtitle">SHIP DESTROYED</span>
  <div id="overbig">0</div>
  <div id="overrec" style="display:none">* NEW RECORD *</div>
  <div id="overstats"></div>
  <div id="hstable"></div>
  <div id="overgo">&gt;&gt; FIRE FOR SONG SELECT &lt;&lt;</div>
</div>
<div id="hiscore">HI 0</div>
<script type="module">
import * as THREE from './static/vendor/three.module.js';
// ================================================================
// game.html = stream.html's real-time delay-buffer landscape
//           + targeting.html's lock-on layer, adapted:
//   - enemies SPAWN FROM PERCUSSIVE EVENTS at the horizon and ride the
//     world scroll in — they arrive as their drum hit reaches your ears
//   - lock grants + volley launches quantize to UPCOMING HEARD ONSETS
//     (the delay buffer means we know them T seconds early); a 1/8s
//     grid is the fallback when the music goes quiet
//   - no bloom pass (vector-green HUD elements over the sunset world)
// stream.html stays untouched as the approved terrain reference.
// ================================================================
// ---- QA error telemetry, registered BEFORE anything can throw ----
// headless bot runs have no console, so "0 errors" must be checkable from
// runs/game-err.jsonl (absence of rows). Registered at the very top so a
// module-load throw is reported instead of dying silently.
// Every POST in this file goes to the dev server's QA endpoints, which do not
// exist behind a static host (github.io). qaPost is a no-op off localhost, so a
// distribution build stays silent instead of filling the console with 404s.
// Declared FIRST -- the error hook below must be able to use it.
const qs=new URLSearchParams(location.search);
// ?qa=1 forces the QA endpoints on regardless of host. Without it there is no
// way to smoke-test a DISTRIBUTION build (which is defined by being served from
// somewhere that is not localhost) -- the error hook rides this same switch, so
// off-localhost the "absence of game-err.jsonl" proof does not exist at all.
const QAHOST=!!qs.get('qa')||/^(localhost|127\.0\.0\.1|\[::1\])?$/.test(location.hostname);
const qaPost=(url,init)=>QAHOST?fetch(url,init).catch(()=>{}):Promise.resolve();
addEventListener('error',e=>qaPost('/log',{method:'POST',body:JSON.stringify({
  runId:'game-err',t:+(performance.now()/1000).toFixed(1),
  msg:String(e.message),src:(e.filename||'')+':'+e.lineno})}));
addEventListener('unhandledrejection',e=>qaPost('/log',{method:'POST',
  body:JSON.stringify({runId:'game-err',t:+(performance.now()/1000).toFixed(1),
  msg:'rejection: '+String(e.reason)})}));
const BOT=!!qs.get('bot');               // QA autoplayer (telemetry baseline)
const TRACE=!!qs.get('trace');           // per-missile flight traces in telemetry
const TANKQA=!!qs.get('tanks');          // QA: field tanks from wave 1
const BOSSQA=+qs.get('boss')||0;         // QA: force the carrier at songT=N
const PODQA=!!qs.get('pods');            // QA: a pod in every wave plan
const LAYQA=!!qs.get('layers');          // QA: a minelayer in every wave plan
const LEADQA=!!qs.get('leaders');        // QA: force 4-flocks, which carry a
                                         // LEADER (rare in normal play: needs
                                         // p>0.9 and four free wave slots)
const VIZQA=+qs.get('viz')||0;           // QA: start in viz mode 0/1/2
const LVQA=+qs.get('lv')||0;             // QA: start at ship form N (+full OD)
const SEAQA=!!qs.get('sea');             // QA: force the flood
const SEA_BASE=qs.get('seabase')!=null?+qs.get('seabase'):0;   // QA: force a floor
const TIDE=+qs.get('tide')||48;          // full-flood ceiling: seeds TU.TIDE_MAX,
                                         // which the tuning panel then moves live
// ---- THE FLOODED SEA ----
// Quiet/DRIFT stretches FLOOD the valleys: a water level rises, drowning
// low ground and leaving ridges as islands. It is a first-class part of
// the world — the hard floor, the autopilot's altitude target, hunter
// avoidance and missile impacts all read max(terrain, sea), so RULE 2
// ("never crash into terrain") extends to the water for free.
let seaLevel=0, seaTarget=0, seaForce=0, bassE=0, seaMax=0;
// seaTop is the CREST of the swell, not its mean: collision has to use the
// surface the player can SEE, or the ship flies through wave tops that the
// floor clamp thinks it is safely above
let seaTop=0, seaAmp=3.0;   // smoothed swell amplitude: the collision crest
                            // must not jitter faster than the ship can climb
let vizMode=0;                           // 0 shaded / 1 wire / 2 battlezone —
                                         // declared here: setShipForm() reads
                                         // it while painting the hull at init
const ITEMQA=!!qs.get('items');          // QA: drop items generously
const NODEQA=!!qs.get('nodes');          // QA: spawn data nodes frequently
const GENUSQA=qs.get('genus')||'';       // QA: force the boss species
const ENDQA=+qs.get('end')||0;           // QA: force level-complete at songT=N
const MUTEQA=!!qs.get('mute');           // QA: muted <audio> may AUTOPLAY in a
                                         // headed Chrome (gestures not needed)
const DYNQ=qs.get('dyn');                 // QA/tuning: dyn-stretch ceiling
const DYNMAX=DYNQ===null?1:+DYNQ;        // DEFAULT OFF: measured and refuted --
// stretching the macro percentile around its MEDIAN makes saturation worse
// (ready-aim-fire pin.hi 35% -> 56% at target 0.62), because the distribution
// is skewed hard to the top, not centred. Machinery kept behind ?dyn=N for
// experiments; see tools/macro_study.py for the offline replica that showed it.
const SPEED=+qs.get('speed')||60;        // world units / s
const T=+qs.get('delay')||6;             // audio delay (s) -> horizon = T*SPEED
const HORIZON=T*SPEED;
const X=216, W=900, HMAX=110;
const ROWHZ=10, ROW_D=SPEED/ROWHZ, LANE_W=W/X;
const CAMBACK=Math.round(HORIZON*0.33);
const BEHIND=Math.ceil((CAMBACK+80)/ROW_D);
const MARGIN=Math.ceil(150/ROW_D);
const AHEAD=Math.ceil(HORIZON/ROW_D)+MARGIN;
const ROWS=AHEAD+BEHIND;
const FINAL_AGE=Math.ceil(160/ROW_D);
// MACRO_A / MESO_A / PLAIN live on the tuning panel (TU) — the P1 lever
let DYN_TARGET=0.62;   // p10..p90 spread of mP a well-shaped track shows
                       // (calibrated from the baseline sweep -- see restart.md)
const FLOORV=0.30, FLUXMIN=0.055, PERCRUN=5;
const COOL_T=0.45, COOL_P=0.70, TONE_H=1.05, PERC_H=0.30;
const MEANDER=14*(216/144), MEANDER_S=25;
const SKIRT=18;                          // lanes of low rim: first to flood

// ---------------- targeting tunables (live keys in HUD) ----------------
const P={
  MAGNET:70,      // [ ]   hover-queue radius (px)
  FOLLOW:0.14,    // - =   ship flight-sway easing (s) — NOT reticle-driven
  HOMING:0.42,    // , .   missile flight time floor (s)
  CASCADE:1,      // ; '   volley stagger in 0.12s steps per queued target
  RSIZE:11,       // o O   reticle half-size (world units at aim plane)
  LOCKMS:120,     // j J   min ms between lock grants (sweep pacing)
  FIRELOCK:1,     // p     1 = cannot lock while the volley is still launching
  QUEUE_MAX:8,
};
// ---------------- the feel-pass tunables (live panel: ` toggles) ----------
// Every number in this build was set by a bot and an argument. These are the
// ones under most doubt, exposed so a human hand can settle them WHILE flying
// rather than across reloads. Panel edits are live; COPY JSON dumps whatever
// differs from these defaults so the winners can be baked back in here.
const TU={
  // rhythm chain — the release grade. Widen ON first if it feels punishing,
  // never GRID: a loose grid fallback is what made the mechanic meaningless.
  RC_ON:0.07, RC_NEAR:0.42, RC_GRID:0.03, RC_CAP:12,
  // survivability
  MINE_DMG:12, RECH_RATE:14, RECH_DELAY:5.0,
  // bosses (HP is a MULTIPLIER on each species' own hp, so the genus
  // silhouette of the fight is preserved while the length is dialled)
  BOSS_HP:1.0, BAY_HP:3,
  // the sea
  TIDE_MAX:TIDE, SWELL_A:3.0, SWELL_B:4.5,   // ?tide=N seeds the ceiling
  // the minelayer's traverse
  // 95 is ~1.6x the player's forward speed: fast enough that the row still
  // reads as one barrier (the rake spreads ~630wu, near the engagement depth),
  // slow enough to read as a deliberate crosser rather than a streak. 150 was
  // 2.5x forward speed and felt like a zip (user call).
  LAY_VX:95, LAY_DX:64, LAY_LEAD:1.15,
  // section boundaries: a timbre change, or an intensity regime change
  SEC_NOV:0.16, SEC_JUMP:0.35,
  // terrain macro shape (the P1 lever)
  MACRO_A:0.16, MESO_A:0.08, PLAIN:0.06,
};
// [object, key, label, min, max, step] grouped by heading
const TUNEDEFS=[
  ['RHYTHM CHAIN',[
    [TU,'RC_ON','onset window s',0.02,0.20,0.005],
    [TU,'RC_NEAR','quiet after s',0.15,1.00,0.02],
    [TU,'RC_GRID','grid window s',0.01,0.08,0.005],
    [TU,'RC_CAP','payout cap x',4,30,1]]],
  ['SURVIVAL',[
    [TU,'MINE_DMG','mine damage',4,30,1],
    [TU,'RECH_RATE','recharge /s',4,40,1],
    [TU,'RECH_DELAY','recharge wait s',1,12,0.5]]],
  ['BOSS',[
    [TU,'BOSS_HP','hull hp x',0.4,2.5,0.1],
    [TU,'BAY_HP','bay hp',1,8,1]]],
  ['SEA',[
    [TU,'TIDE_MAX','tide ceiling',0,90,2],
    [TU,'SWELL_A','swell floor',0,10,0.5],
    [TU,'SWELL_B','swell x bass',0,14,0.5]]],
  ['MINELAYER',[
    [TU,'LAY_VX','traverse wu/s',30,260,5],
    [TU,'LAY_DX','mine spacing wu',24,180,4],
    [TU,'LAY_LEAD','station x horizon',0.5,1.45,0.05]]],
  ['SECTIONS',[
    [TU,'SEC_NOV','novelty trip',0.05,0.40,0.01],
    [TU,'SEC_JUMP','intensity jump',0.10,0.80,0.01]]],
  ['TERRAIN',[
    [TU,'MACRO_A','macro amp',0,0.40,0.01],
    [TU,'MESO_A','meso amp',0,0.30,0.01],
    [TU,'PLAIN','plain floor',0,0.30,0.01]]],
  ['TARGETING',[
    [P,'MAGNET','hover radius px',20,140,2],
    [P,'FOLLOW','ship sway s',0.02,0.40,0.01],
    [P,'HOMING','missile floor s',0.10,1.00,0.02],
    [P,'RSIZE','reticle size',5,20,0.5],
    [P,'LOCKMS','lock gap ms',40,400,10]]],
];
const KEYS={'[':['MAGNET',-4],']':['MAGNET',4],'-':['FOLLOW',-0.02],'=':['FOLLOW',0.02],
  ',':['HOMING',-0.05],'.':['HOMING',0.05],';':['CASCADE',-1],"'":['CASCADE',1],
  o:['RSIZE',-0.5],O:['RSIZE',0.5],j:['LOCKMS',-40],J:['LOCKMS',40]};
const GREEN=0x33ff55, PALE=0xd6ffe0;
// canvas text face — starts as the system mono and upgrades to the cabinet
// face once it has actually LOADED (a canvas draw silently falls back
// otherwise). Declared here because drawDigit() paints at init.
let arcFont='ui-monospace,monospace', arcReady=false;

// ---------------- audio: dry tap -> analyser, delayed path -> ears ----------------
const actx=new AudioContext();
const analyser=actx.createAnalyser();
analyser.fftSize=4096; analyser.minDecibels=-90; analyser.maxDecibels=-10;
analyser.smoothingTimeConstant=0;
const delay=actx.createDelay(Math.max(1,T)+1); delay.delayTime.value=T;
// mix bus: music + sfx -> master compressor -> ears. The compressor glues hot
// SFX transients over the loud mastered track instead of clipping, which is
// what lets the SFX run hot enough to cut through.
const MUSIC_LVL=qs.get('quiet')?0.04:0.65, DUCK_LVL=MUSIC_LVL*0.55;
const comp=actx.createDynamicsCompressor();
comp.threshold.value=-14; comp.ratio.value=4;
comp.attack.value=0.003; comp.release.value=0.25;
comp.connect(actx.destination);
const outGain=actx.createGain();
outGain.gain.value=MUSIC_LVL;
analyser.connect(delay); delay.connect(outGain); outGain.connect(comp);
// THE MUSIC ORB'S OWN ANALYSER. The main `analyser` above taps the DRY signal,
// T seconds BEFORE the ears hear it -- correct for terrain, which is written at
// the horizon, and wrong for a visualizer, which must move with what is
// actually playing. So this one taps AFTER the delay node. It also taps BEFORE
// outGain, so ducking and ?quiet shrink the sound but never the picture.
const visAn=actx.createAnalyser();
visAn.fftSize=2048; visAn.minDecibels=-88; visAn.maxDecibels=-16;
visAn.smoothingTimeConstant=0.5;   // a visualizer wants ballistics, not truth
delay.connect(visAn);
const el=new Audio();          // no loop: the song IS the level
actx.createMediaElementSource(el).connect(analyser);
// ears run T behind the file — but most tracks END in a fade, so waiting the
// full T replays near-silence. We track the last AUDIBLE dry moment and end
// the level once that moment has reached the ears (+ a short breath).
let trackEnded=false, endedAtSongT=0, lastLoudT=0;
el.addEventListener('ended',()=>{trackEnded=true;endedAtSongT=songT;

// rule 1 ENFORCED AT SPAWN: tanks deploy only on LOW, OPEN ground. The whole
// corridor between the horizon and the camera is already written in H (the
// delay buffer's gift), so before committing we PROVE the lane: (a) the
// spawn ground is flat, (b) nothing between the spawn row and the camera
// stands meaningfully taller than the tank's own ground — it can never live
// its life hidden behind a mountain. No honest lane -> no tank this beat.
let tankRejects=0;
// rows younger than FINAL_AGE haven't had their fractal pass yet, but the
// pass is BOUNDED: at most w*0.55 + 0.03 on top of the raw height. Testing
// the bound lets tanks spawn ~100wu farther while the no-masking proof holds.
const detailBound=h=>h+0.55*Math.pow(Math.max(0,h-0.05),1.1)+0.03;
function tankLane(z0){
  const si0=Math.max(0,Math.round((z0-mesh.position.z-zFar)/ROW_D));
  const camSlot=Math.min(ROWS-1,AHEAD+Math.round(CAMBACK/ROW_D));
  let best=-1,bestCost=1e9;
  for(let x=24;x<X-24;x+=2){
    let g0=0;
    for(let k=-2;k<=2;k++)g0=Math.max(g0,H[si0*X+x+k]);
    if(g0>0.32)continue;                   // not flat enough to park on
    if(g0*HMAX<seaLevel+3)continue;        // drowned: no tanks in the sea
    let ahead=0;
    for(let s=si0+1;s<=camSlot;s++)
      for(let k=-2;k<=2;k++){
        let h=H[s*X+x+k];
        if(s<FINAL_AGE)h=detailBound(h);   // judge the FINAL terrain, not raw
        if(h>ahead)ahead=h;
      }
    if(ahead>g0+0.12)continue;             // a ridge in front would mask it
    // the column check can't see DIAGONAL masking (the camera roams
    // laterally) — also march the real camera->spawn ray, right now
    const wx=(x+0.5)*LANE_W-W/2;
    if(!losClear(mv1.set(wx,terrainH(wx,z0)+8,z0)))continue;
    const cost=g0+ahead*0.5+Math.abs(x-X/2)*0.0008;  // low, open, central
    if(cost<bestCost){bestCost=cost;best=x;}
  }
  return best;
}
function spawnTank(p){

  const z0=zFar+12*ROW_D+mesh.position.z;
  const lx=tankLane(z0);
  if(lx<0){tankRejects++;return false;}    // field too rough: convert the slot
  waveSpawned++;
  const mt2=new THREE.MeshLambertMaterial({color:TANKRED,emissive:TANKRED_EM,
    flatShading:true,fog:false,transparent:true,opacity:1});

// ---- per-section SFX timbre (gap-memo pull, fourth pass) ----
// The synesthesia contract, extended from pitch to TIMBRE: the section
// class picks the oscillator recipe for every MUSICAL tone (lock ticks,
// hit chimes, arpeggios, jingles). DRIFT breathes sine, PULSE/BUILD speak
// triangle, SURGE bites sawtooth over a sub voice, BLOOM plays detuned
// squares (the organ). Alarms and warnings keep their fixed voices —
// they are UI, not music. Analyzed LAYERS add a quiet fifth on top: the
// instrument itself grows as the player opens the track.
const SEC_VOICE={drift:'sine',pulse:'triangle',build:'triangle',
                 surge:'sawtooth',bloom:'square'};
function vtone(freq,at,dur=0.12,gain=0.25,slide=0){
  const w=SEC_VOICE[curSecCls]||'square';
  tone(freq,at,dur,w,gain,slide);
  if(curSecCls==='bloom')tone(freq*1.007,at,dur,'square',gain*0.55,slide);
  else if(curSecCls==='surge')tone(freq*0.5,at,dur,'sawtooth',gain*0.35,slide);
  if(layerLvl>=4)tone(freq*1.5,at,dur*0.8,'triangle',gain*0.25,slide);
}

function planWave(){
  const perc=percRate.length, ton=tonalRate.length;
  const total=Math.max(1,perc+ton);
  const intensity=Math.max(0,Math.min(1,macroOut.y*(0.8+heat*0.4)));
  let n=Math.max(2,Math.min(P.QUEUE_MAX,Math.round(2+intensity*6)));

  // one more slot per wave (Rez's layers escalate with player progress)
  n=Math.min(P.QUEUE_MAX,n+Math.floor(layerLvl/3));
  // section archetypes: DRIFT breathes (sparse), SURGE is flock country,
  // BLOOM is artillery country — the section IS the wave designer
  if(curSecCls==='drift')n=Math.max(2,n-2);
  // ground artillery from wave 3 (?tanks=1 forces wave 1): intense music
  // fields a tank; a hot player earns a second from wave 5
  let tanks=waveNum>=(TANKQA?1:3)?((intensity>0.45||TANKQA)?1:0)+(heat>0.8&&waveNum>=5?1:0):0;
  if(curSecCls==='bloom'&&waveNum>=(TANKQA?1:3))tanks++;
  // world DNA: a percussive track fields armor a wave earlier
  if(FP&&FP.percFrac>=0.3&&waveNum>=2&&intensity>0.55&&!tanks)tanks=1;
  if(curSecCls==='drift')tanks=0;
  tanks=Math.min(tanks,Math.max(0,n-2));   // never a mostly-tank wave
  // Defender tier: quiet/tonal sections hang PODS (passive until popped);
  // every third wave — and bloom sections — field a MINE-LAYER
  let pods=PODQA?1
          :(curSecCls==='drift'||curSecCls==='build')&&n>=2?1
          :(waveNum%2===0)?1:0;      // every even wave hangs a pod (user call:
                                     // the burst should be a REGULAR sight)
  let layers=LAYQA?1:(waveNum>=2&&(waveNum%3===2||curSecCls==='bloom')?1:0);
  if(FP&&FP.percFrac<0.03&&!pods)pods=1;  // tonal world: Defender-rich
  pods=Math.max(0,Math.min(pods,n-tanks-1));
  layers=Math.max(0,Math.min(layers,n-tanks-pods-1));
  let hunters=Math.round((n-tanks-pods-layers)*perc/total);
  if(curSecCls==='surge')hunters=Math.max(hunters,Math.min(n-tanks-pods-layers,3));
  if(hunters===1)hunters=perc>=3?2:0;      // a flock needs at least 2
  // ...and a flock of TWO is a pair, not a formation, so it carries no leader.
  // Rounding down to 2 is what made leaders unreachable: take the third hunter
  // whenever the wave can afford it, and widen the wave by one to afford it
  // when the music is driving hard enough to deserve a formation.
  if(hunters===2){
    const room=n-tanks-pods-layers;
    if(room>=3)hunters=3;
    else if(intensity>0.5&&n<P.QUEUE_MAX){n++;hunters=3;}
  }
  if(hunters+tanks+pods+layers>n)hunters=Math.max(0,n-tanks-pods-layers);
  // QA: a LEADER needs a 4-flock, which needs four hunter slots in one wave.
  // Forcing the flock size alone was not enough -- the wave PLAN is what
  // starves it, so this widens the wave and reserves the slots.
  if(LEADQA){hunters=4;n=Math.max(n,4+tanks+pods+layers);}

}

const HSPD_MAX=82, HSPD_MIN=32;
const hv1=new THREE.Vector3(), hv2=new THREE.Vector3(), hv3=new THREE.Vector3(),
      hCen=new THREE.Vector3(), hAli=new THREE.Vector3();
function steerHunter(m,hunters,dt){
  const u=m.userData, v=u.v, pos=m.position;
  hv1.set(0,0,0);
  // seek the ship
  hv2.copy(shipPos).sub(pos).normalize().multiplyScalar(HSPD_MAX).sub(v);
  if(hv2.length()>140)hv2.setLength(140);
  hv1.add(hv2);
  // flock: separation (strong, close), cohesion + alignment (gentle)
  let n=0; hCen.set(0,0,0); hAli.set(0,0,0);
  for(const o of hunters){
    if(o===m||o.userData.flock!==u.flock)continue;
    const d=pos.distanceTo(o.position);
    hCen.add(o.position); hAli.add(o.userData.v); n++;
    if(d<16&&d>0.01){
      hv3.copy(pos).sub(o.position).multiplyScalar((16-d)/d);
      hv1.addScaledVector(hv3,3.0);
    }
  }
  if(n){
    hCen.divideScalar(n).sub(pos); hv1.addScaledVector(hCen,0.35);
    hAli.divideScalar(n).sub(v);   hv1.addScaledVector(hAli,0.5);
  }
  // terrain avoidance: climb if the ground ahead (0.9s) crowds the belly
  const gHere=groundY(pos.x,pos.z);
  const gAhead=groundY(pos.x+v.x*0.9,pos.z+v.z*0.9);
  const clear=pos.y-Math.max(gHere,gAhead);
  if(clear<28)hv1.y+=(28-clear)*14;
  v.addScaledVector(hv1,dt);
  const sp=v.length();
  if(sp>HSPD_MAX)v.multiplyScalar(HSPD_MAX/sp);
  else if(sp<HSPD_MIN&&sp>0.01)v.multiplyScalar(HSPD_MIN/sp);
  pos.addScaledVector(v,dt);
  if(pos.y<gHere+16)pos.y=gHere+16;            // hard floor
  m.lookAt(hv2.copy(pos).add(v));              // nose along the velocity
}

function losClear(p){

  const steps=Math.floor(Math.hypot(dx,dy,dz)/15);

// full kill bookkeeping — shared by direct hits and splash
function killEnemy(m,tNow){
  if(m.userData.type==='bay'){
    // a silenced bay takes its pattern out of the boss's rotation; the last
    // one drops the hull shield — CORE EXPOSED, the sponge phase begins
    const host=m.userData.host, hu=host.userData;
    const bi=hu.bays.indexOf(m); if(bi>=0)hu.bays.splice(bi,1);
    const pi=hu.patterns.indexOf(m.userData.pattern);
    if(pi>=0)hu.patterns.splice(pi,1);
    popup(m.position,'BAY SILENCED','#ffd76a',1.3);
    tone(500,tNow,0.12,'square',0.16);tone(350,tNow+0.1,0.18,'square',0.16,-60);
    if(!hu.bays.length){
      hu.flash=0.8;
      popup(host.position,'CORE EXPOSED','#ffd76a',1.8);
      [7,4,0].forEach((d,j)=>tone(nt(d)*2,tNow+j*0.08,0.2,'sawtooth',0.18));
    }
  }
  if(m.userData.type==='node'){
    // ANALYZED: the layer rises and the world deepens with it
    nodesOpened++; layerLvl=Math.min(10,layerLvl+1);
    popup(m.position,'ANALYZED · LAYER '+layerLvl,'#66bbff',1.5);
    [0,1,2,3].forEach((d,j)=>vtone(echoNote(d),tNow+j*0.07,0.18,0.2));
  }
  if(m.userData.type==='boss'){
    boss=null;
    if(m.userData.genus==='leviathan')seaForce=0;   // the tide goes out
    for(let i=0;i<6;i++){const bp=m.position.clone();
      bp.x+=(hash(i,1)*2-1)*30;bp.y+=(hash(i,2)*2-1)*12;bp.z+=(hash(i,3)*2-1)*30;
      boom(bp,true);}
    popup(m.position,(m.userData.name||'CARRIER')+' DOWN','#ffd76a',2);
    explosion(tNow,2.4,0); explosion(tNow+0.18,1.6,0); explosion(tNow+0.35,1.9,0);
    [0,4,7,9,7].forEach((d,j)=>tone(nt(d%8)*2,tNow+j*0.09,0.25,'triangle',0.22));
    // a downed boss showers items across three successive offbeats
    dropItem('red',m.position.clone());
    dropItem('blue',m.position.clone(),0.5);
    dropItem('red',m.position.clone(),1.0);
  }
  boom(m.position.clone());
  radarPing(m.position,
    m.userData.type==='boss'?'#ffd76a':m.userData.type==='node'?'#55ccff'
    :'#ff5b4b', m.userData.type==='boss');
  // every kill THUMPS, sized by what died, attenuated by where it died —
  // splash-chain kills were silent before and now land as a rolling barrage
  if(m.userData.type!=='boss')
    explosion(tNow,0.6+Math.min(0.7,(m.userData.bounty||10)/150),   // caps at 150
      m.position.distanceTo(shipPos));
  popup(m.position,'+'+(m.userData.bounty||10));
  // the Defender bargain: a destroyed pod bursts into a swarm
  if(m.userData.type==='pod')spawnSwarmers(m.position,tNow);
  if(m.userData.type==='layer')popup(m.position,'MINELAYER DOWN','#ffd76a',1.5);
  dropTag(m); scene.remove(m); enemies.delete(m);
  let qi, hadQ=false;
  while((qi=queue.indexOf(m))>=0){queue.splice(qi,1);hadQ=true;}  // ALL stacks
  if(hadQ)drawDigit(queue.length);
  if(pendingSet.has(m)){pending.splice(pending.indexOf(m),1);pendingSet.delete(m);}
  // shells / mines / swarmers aren't wave members: they score + chain, but
  // stay out of the clearRate=waveKills/waveSpawned math (never spawned-counted)
  kills++;if(!m.userData.noWave)waveKills++;
  chain++;bestChain=Math.max(bestChain,chain);
  // small tiered points by enemy difficulty: 10/25 dummy, 50 hunter,
  // 100 elite leader, 75 tank, 20 shell — chain is a stat, not a multiplier
  score+=m.userData.bounty||10;
  // elite kills earn a RED item (the overdrive economy: kills no longer
  // charge OD directly — the drop does), spaced so tank-rich waves don't
  // flood the field with rings
  // `elite`, not a points threshold: the drop marks a TIER, and keying it on
  // the bounty number meant any award change silently moved the item economy
  // (raising the pod's award 5x would have started dropping red rings).
  if(m.userData.elite&&m.userData.type!=='boss'
     &&(ITEMQA||songT-lastRedT>6)){lastRedT=songT;dropItem('red',m.position.clone());}
}
function otherInbound(t,self){
  for(const o of missiles)if(o!==self&&o.target===t)return true;
  return false;
}
// a MISSED missile releases its claim: the survivor reverts red + lockable
// again, tag dropped, soft down-blip so the miss registers
function releaseClaim(mis,tNow){
  const m=mis.target;
  if(!enemies.has(m)||otherInbound(m,mis))return;
  if(queue.includes(m))return;   // re-locked via press while missile flew
  m.userData.claimed=false; m.userData.queued=0;
  if(m.userData.tag)m.userData.tag.scale.setScalar(m.userData.tagBase||7); // box reverts to white idle
  tone(320,tNow,0.12,'square',0.1,-120);
}
// bullet-sponge support: a boss soaks one missile per hp point and chips
// +10 a hit; everything else dies to the first — the ONLY entry point for
// missile damage (direct hits and every splash loop go through here)
function hitEnemy(m,tNow){
  const u=m.userData;
  // newborn swarmers are BLAST-IMMUNE during their stunned bloom: the splash
  // of the very missile that popped the pod snapshots the enemy set AFTER the
  // burst, and was annihilating all five on their birth frame — the swarm
  // escapes the explosion (Defender-authentic), then becomes fair game
  if(u.stun>0&&u.noWave)return;
  if(u.type==='item'){collectItem(m,tNow);return;}   // a "hit" on a ring COLLECTS it
  if(u.type==='boss'&&u.bays&&u.bays.length){
    // shielded while any bay lives — even splash CLINKS off (the anatomy
    // is the only way in); throttled popup so bay splash doesn't spam it
    u.flash=0.4;
    if(!u.shPop||tNow-u.shPop>0.6){u.shPop=tNow;
      popup(m.position,'SHIELDED','#8fc4c6',0.9);}
    tone(220,tNow,0.08,'square',0.14);
    return;
  }
  if(u.hp>1){
    u.hp--; u.flash=0.5;
    score+=10; popup(m.position,'+10');
    boom(m.position.clone());
    explosion(tNow,0.9,m.position.distanceTo(shipPos));  // armor chip WHUMP
    vtone(echoNote(2),tNow,0.08,0.15);
    if(!otherInbound(m,null)){u.claimed=false;u.queued=0;}  // re-lockable between volleys
  }else killEnemy(m,tNow);
}

  TUNEDEFS.flatMap(([,rows])=>rows.map(([o,k])=>[k,o[k]])));

function tuneDirty(){
  const d={};

function buildTune(){

    const h=document.createElement('h2'); h.textContent=group; tuneEl.appendChild(h);
    for(const [obj,key,label,min,max,step] of rows){
      const row=document.createElement('div'); row.className='row';
      const lb=document.createElement('label'); lb.textContent=label;
      const input=document.createElement('input');
      input.type='range'; input.min=min; input.max=max; input.step=step;
      const out=document.createElement('span'); out.className='val';
      input.addEventListener('input',()=>{obj[key]=+input.value;tuneSync();});
      row.append(lb,input,out); tuneEl.appendChild(row);
      tuneRows.push({obj,key,input,out,row,step});
    }
  }

  const copy=document.createElement('button'); copy.textContent='COPY JSON';
  copy.onclick=()=>{
    const j=JSON.stringify(tuneDirty(),null,1);
    navigator.clipboard?.writeText(j).catch(()=>{});
    console.log('[tune] changed from defaults:\n'+j);
    copy.textContent='COPIED'; setTimeout(()=>copy.textContent='COPY JSON',900);
  };
  const reset=document.createElement('button'); reset.textContent='RESET';
  reset.onclick=()=>{
    for(const r of tuneRows)r.obj[r.key]=TUNE_DEFAULTS[r.key];
    try{localStorage.removeItem(TUNE_LS);}catch(_){}
    tuneSync();
  };
  btns.append(copy,reset); tuneEl.appendChild(btns);
  const note=document.createElement('div'); note.className='note';
  note.textContent='` closes · gold = changed from default';
  tuneEl.appendChild(note);

  // must always fly the shipped numbers
  if(!BOT){

      for(const r of tuneRows)if(saved[r.key]!==undefined)r.obj[r.key]=+saved[r.key];

// world-DNA summary: the INTERESTING floor (does this ONE track build a level
// with shape?) and the DISTINCT axes (does it build a DIFFERENT one?).
function dnaSummary(){
  const pk=(a,q)=>a.length?a[Math.min(a.length-1,(a.length*q)|0)]:0;
  const st=(arr)=>{
    if(!arr.length)return null;
    const a=[...arr].sort((x,y)=>x-y);
    const mean=arr.reduce((s,v)=>s+v,0)/arr.length;
    const sd=Math.sqrt(arr.reduce((s,v)=>s+(v-mean)*(v-mean),0)/arr.length);
    return {p10:+pk(a,0.10).toFixed(2),p50:+pk(a,0.50).toFixed(2),
            p90:+pk(a,0.90).toFixed(2),sd:+sd.toFixed(2)};
  };
  if(!dna.row.length)return null;
  const g=dna.gain;
  return {n:dna.row.length, camY:st(dna.camY), row:st(dna.row), mp:st(dna.mp),
    tall:+(dna.row.filter(v=>v>TALLWU).length/dna.row.length).toFixed(3),
    // the monotony that actually bites: the percentile PINNED at an end of its
    // range. A stretch of terrain held at max height is as dull as a flat one,
    // and spread alone cannot see it (0..1 with both ends pinned looks great).
    pin:{hi:+(dna.mp.filter(v=>v>=0.97).length/dna.mp.length).toFixed(3),
         lo:+(dna.mp.filter(v=>v<=0.03).length/dna.mp.length).toFixed(3)},
    gain:{mean:+(g.reduce((s,v)=>s+v,0)/g.length).toFixed(2),
          max:+Math.max(...g).toFixed(2)},
    dynmax:DYNMAX, target:DYN_TARGET};
}

  // edge, behind to the bottom (vertical hits fold into the same pair)
  const dx=from.x-shipPos.x, dy=from.y-shipPos.y, dz=from.z-shipPos.z;
  let el;
  if(Math.abs(dx)>Math.max(Math.abs(dy),Math.abs(dz)*0.6))el=dx<0?hitEls.L:hitEls.R;
  else if(Math.abs(dy)>Math.abs(dz)*0.6)el=dy>0?hitEls.T:hitEls.B;

// ---- arcade end-screen tally ----
// Each stat counts 0 -> final % with a ticking blip (rising as it climbs),
// lands with a chime + a score pop as its bonus rolls into the total; the
// NEW RECORD blink and the best-scores board reveal only once the tally
// is done (record sting on a good run). WALL-CLOCK via setInterval — the
// cinematic lesson: rAF throttles in occluded windows. First press skips
// the tally; the next press goes to song select as before.
let tallyTimer=null;
function runTally(base,stages,rank,boardHTML,good){
  const bigEl=document.getElementById('overbig'),
        statsEl=document.getElementById('overstats'),
        recEl=document.getElementById('overrec'),
        hsEl=document.getElementById('hstable');
  statsEl.textContent=''; hsEl.innerHTML=''; recEl.style.display='none';
  bigEl.textContent=fmt(base);
  const COUNT=900, POP=380, STEP=COUNT+POP;   // ms: count phase + bonus pop
  if(tallyTimer){clearInterval(tallyTimer);tallyTimer=null;}   // never stack
  const t0=performance.now();
  let lastBlip=0, done=false;
  const finish=()=>{
    if(done)return; done=true;
    if(ENDQA||qs.get('shots'))setTimeout(()=>qaPost('/log',{method:'POST',
      body:JSON.stringify({runId:'game-end',big:bigEl.textContent,
        stats:statsEl.textContent,rec:recEl.style.display,
        board:hsEl.textContent,font:getComputedStyle(bigEl).fontFamily,
        score,stages:stages.map(g=>({l:g.label,p:g.pct,b:g.bonus}))})
      }).catch(()=>{}),60);
    if(tallyTimer){clearInterval(tallyTimer);tallyTimer=null;}
    bigEl.textContent=fmt(score);
    statsEl.textContent=stages.map(sg=>
      `${sg.label} ${sg.pct}% · +${sg.bonus}`).join('   ');
    hsEl.innerHTML=boardHTML;
    if(rank===0){recEl.style.display='block';
      if(good)[0,4,7,12,16].forEach((d,j)=>      // record sting: climbs
        tone(nt(d%8)*(d>=8?4:2),actx.currentTime+j*0.07,0.25,'triangle',0.2));}
  };
  overEl.addEventListener('pointerdown',function skip(e){
    if(!done){e.stopPropagation();finish();}     // first press = show it all
    overEl.removeEventListener('pointerdown',skip,true);
  },true);
  if(!stages.length){finish();return;}
  tallyTimer=setInterval(()=>{
    const el=performance.now()-t0;
    if(el>=stages.length*STEP+220){finish();return;}
    let acc=base, txt='';
    for(let i=0;i<stages.length;i++){
      const sg=stages[i], lt=el-i*STEP;
      if(lt<0)break;
      if(txt)txt+='   ';
      if(lt>=STEP){acc+=sg.bonus;txt+=`${sg.label} ${sg.pct}% · +${sg.bonus}`;}
      else if(lt<COUNT){
        const p=ez(lt/COUNT);
        txt+=`${sg.label} ${Math.round(sg.pct*p)}%`;
        if(el-lastBlip>85){lastBlip=el;         // the counting tick, rising
          tone(480+520*p,actx.currentTime,0.03,'square',good?0.06:0.035);}
      }else{
        if(!sg.rang){sg.rang=true;              // landed: chime + score pop
          vtone(nt(4)*2,actx.currentTime,0.14,0.2);
          vtone(nt(7)*2,actx.currentTime+0.07,0.16,0.18);
          bigEl.animate([{transform:'scale(1.18)'},{transform:'scale(1)'}],
            {duration:260,easing:'ease-out'});}
        acc+=sg.bonus*ez((lt-COUNT)/POP);       // bonus rolls into the total
        txt+=`${sg.label} ${sg.pct}% · +${sg.bonus}`;
      }
    }
    bigEl.textContent=fmt(Math.round(acc));
    statsEl.textContent=txt;
  },30);
}

let playing=false, candRate=[], selRate=[], percRate=[], tonalRate=[];
function analyze(dt){
  analyser.getFloatFrequencyData(dbBins);
  for(let i=0;i<BANDS;i++){
    let m=-140;
    for(let b=edges[i];b<edges[i+1];b++)m=Math.max(m,dbBins[b]);
    vPrev[i]=vBand[i];
    vBand[i]=Math.max(0,Math.min(1,(m+72)/62));
  }
  for(let i=0;i<BANDS;i++)
    fluxCur[i]=vBand[i]>=FLOORV?Math.max(0,vBand[i]-vPrev[i]):0;
  {let b0=0;for(let i=0;i<9;i++)b0+=vBand[i];bassE=b0/9;}   // swell drive
  let fP=0,fT=0;   // this frame's flux energy, split perc/tonal at run level
  let b=0;
  while(b<BANDS){
    if(fluxCur[b]<FLUXMIN){b++;continue;}
    let b1=b,str=0,peak=b,fp=0;
    while(b1<BANDS){
      const fb=fluxCur[b1];
      if(fb<FLUXMIN)break;
      str+=fb;if(fb>fp){fp=fb;peak=b1;}b1++;
    }
    // broadband RUN alone isn't percussive: pad swells splatter adjacent
    // bands too (stress-track finding — qa-drift labeled itself SURGE). The
    // real discriminator is TIME, not level: a swell's bands were ALREADY
    // fluxing on the previous frame (a slow rise fires flux for dozens of
    // 60Hz frames), a drum transient's weren't. Loudness-independent — a
    // flat mean-flux gate tried first gutted qa-thrash's real drums.
    let prevF=0;for(let k2=b;k2<b1;k2++)prevF+=fluxPrev[k2];
    const perc=(b1-b)>=PERCRUN&&prevF<str*0.5;
    if(perc)fP+=str; else fT+=str;
    if(!FP){                       // fingerprint reads RUNS, pre-selection
      fpAcc.strAll+=str;
      if(perc){
        fpAcc.strPerc+=str;
        const dI=songT-fpAcc.lastPerc;
        if(dI>=0.15&&dI<=1.5)fpAcc.iois.push(dI);
        if(dI>=0.15)fpAcc.lastPerc=songT;
      }
    }
    strRing.push(str);candRate.push(songT);
    const p=strRing.pct(str);
    if(perc?(p>=0.45&&songT-lastP>=COOL_P):(p>=0.20&&songT-lastT>=COOL_T)){
      if(perc)lastP=songT;else lastT=songT;
      selRate.push(songT);
      (perc?percRate:tonalRate).push(songT);
      pushHeard();                                   // every selected event is a music-grid tick
      if(seaLevel>6&&perc&&Math.random()<0.5){       // surf breaks on the beat
        const at=actx.currentTime+T;
        noiseBurst(at,0.5,0.05*Math.min(1,seaLevel/34));
      }
      const amp=0.18+1.15*Math.pow(p,2.2);
      if(perc){
        const side=(globalRow%2?1:-1),off=((42+(globalRow*7)%92)/LANE_W)*side;
        const cx=X/2+mw(songT)+off;
        addStamp(cx,13+8*p,PERC_H*amp);
        spawnEnemy(cx,p);                            // drum hits become shootable formations
      }else{
        pitchRing.push(peak);
        for(let c=0;c<12;c++)chroma[c]*=0.985;     // slow decay: keys can drift
        chroma[bandChroma[peak]]+=1; noteKey();    // re-estimate the track's key

        if((NODEQA?songT-lastNodeT>6:p>=0.85&&songT-lastNodeT>18)

        // when only drums spawned (qa-crescendo: 8 real enemies in 160s)
        const tFeeds=(FP?FP.percFrac<0.03:false)
                   ||tonalRate.length>=3*Math.max(1,percRate.length);

function addStamp(cx,sw,h){
  const sx=sw/LANE_W, sr=sw/ROW_D, reach=Math.ceil(sr*3);
  const st={center:globalRow,cx,sx,sr,h,reach};
  stamps.push(st);
  for(let dr=0;dr<=reach;dr++){
    const s=dr; if(s>=ROWS)break;
    stampRow(st,s,dr);
  }
}
function stampRow(st,slot,dr){
  const g0=Math.exp(-(dr*dr)/(2*st.sr*st.sr));
  if(g0<0.02)return;
  const xx=Math.ceil(st.sx*3);
  for(let x=Math.max(0,Math.floor(st.cx-xx));x<Math.min(X,Math.ceil(st.cx+xx));x++){
    const g=g0*Math.exp(-((x-st.cx)**2)/(2*st.sx*st.sx));
    if(g>0.02)sat(slot*X+x,st.h*g);
  }
}

// ---------------- row advance (10Hz) ----------------
function advanceRow(){
  globalRow++;
  H.copyWithin(X,0,(ROWS-1)*X);
  rowSec.copyWithin(1,0,ROWS-1); rowSec[0]=curPal;   // new rows wear the new coat
  const e=vBand.reduce((a,v)=>a+v,0)/BANDS;
  if(e>0.02)lastLoudT=songT;             // last audible moment (dry signal)
  if(!FP&&playing){                      // fingerprint accumulation (10Hz)
    let cs=0,cw=0;
    for(let i=0;i<BANDS;i++){cs+=vBand[i]*i;cw+=vBand[i];}
    if(cw>0.5){fpAcc.cenSum+=cs/cw/BANDS;fpAcc.cenN++;}
    fpAcc.eSamp.push(e);
    if(songT>=30)freezeFP();             // the DNA is read once, at 30s
  }
  const mac=macroE.step(e,1/ROWHZ);
  const mes=Math.max(0,mesoE.step(e,1/ROWHZ)-mac);
  macroRing.push(mac);mesoRing.push(mes);
  const mP=macroOut.step(macroRing.pct(mac),1/ROWHZ);
  const sP=mesoOut.step(mesoRing.pct(mes),1/ROWHZ);
  mpRing.push(mP);
  if(DYNMAX>1&&globalRow%10===0&&mpRing.a.length>=120){   // 1Hz, after 12s warm-up
    const q=[...mpRing.a].sort((a,b)=>a-b);
    const spread=q[(q.length*0.9)|0]-q[(q.length*0.1)|0];
    const want=Math.max(1,Math.min(DYNMAX,DYN_TARGET/Math.max(0.04,spread)));
    dynG+=(want-dynG)*(1-Math.exp(-1/8));                 // 8s glide: no terrain step
  }
  // the stretch shapes the WORLD (terrain + the camera choreography that reads
  // it) and nothing else: section boundaries stay on the raw percentile because
  // "the music changed regime" is a musical measurement, and wave intensity
  // stays raw because difficulty should not inflate with a shaping gain.
  const mS=expand(mP,dynG);
  moodHist.push({t:songT,v:mS});         // camera-mood lookahead source
  while(moodHist.length&&moodHist[0].t<songT-T-1.5)moodHist.shift();
  // section novelty: normalized spectral shape, fast EMA vs slow EMA
  {
    let sum=0; for(let i=0;i<BANDS;i++)sum+=vBand[i];
    if(sum>0.5){
      const kf=1-Math.exp(-(1/ROWHZ)/2.0), ks=1-Math.exp(-(1/ROWHZ)/10);
      let nov=0;
      for(let i=0;i<BANDS;i++){
        const v=vBand[i]/sum;
        secFast[i]+=(v-secFast[i])*(secSeeded?kf:1);
        secSlow[i]+=(v-secSlow[i])*(secSeeded?ks:1);
        nov+=Math.abs(secFast[i]-secSlow[i]);
      }
      secSeeded=true; lastNov=nov;
      if(globalRow%10===0)novSamp.push(+nov.toFixed(3));   // tuning telemetry
      // warm-up guard: the rings need ~12s before percentiles mean anything.
      // A boundary is a timbre change (novelty) OR an intensity regime change
      // (the level walked far from where this section came in)
      if(songT>12&&songT-lastSecT>12
         &&(nov>TU.SEC_NOV||Math.abs(mP-secEntryInt)>TU.SEC_JUMP))sectionBoundary(mP);
      if(secProbe&&songT>=secProbe)sectionProbe(mP);
    }
  }
  const base=TU.PLAIN+mS*(TU.MACRO_A+TU.MESO_A*sP);
  const mwr=mw(songT);
  for(let x=0;x<X;x++){
    const u=(x-X/2-mwr)/(X/2);
    const prof=0.80+0.14*Math.sin(u*2.4+0.6+songT*0.10)*Math.sin(u*5.1-1.2-songT*0.07)
              +0.06*Math.sin(u*1.3+songT*0.05);

    const st=stamps[i], dr=globalRow-st.center;

      const i=fs*X+x;
      H[i]=H[i]*0.7+(H[i-1]+H[i+1])*0.15;
    }
    for(let x=0;x<X;x++){
      const i=fs*X+x, ux=x*LANE_W*0.033;
      const f=0.38*vnoise(uz,ux)+0.27*vnoise(uz*2.1,ux*2.1)+0.18*vnoise(uz*4.3,ux*4.3)
             +0.11*vnoise(uz*8.9,ux*8.9)+0.06*vnoise(uz*17.8,ux*17.8);
      const ridged=1-Math.abs(2*f-1);
      const w=Math.pow(Math.max(0,H[i]-0.05),1.1);
      const roll=(vnoise(uz*0.2,ux*0.2)-0.5)*0.05;
      H[i]+=w*(ridged-0.5)*1.1+roll*Math.max(0,1-H[i]*3);
      // the rim is the LOWEST ground, so it is the first thing the tide
      // takes: on a watery track the corridor ends up framed by sea, and on
      // a dry one it is still a shelf of land falling away
      const d=Math.min(x,X-1-x);
      if(d<SKIRT){const t2=d/SKIRT;H[i]*=t2*t2*(3-2*t2)*0.92+0.08;}
    }

    // camera actually is. Warm-up excluded -- the opening rows are flat by
    // construction and would drag every track's numbers toward each other.
    if(playing&&songT>5){

      dna.row.push(+(rm*HMAX).toFixed(1)); dna.camY.push(+camY.toFixed(1));
      dna.mp.push(+mP.toFixed(3)); dna.gain.push(+dynG.toFixed(2));
    }

}

      const steep=1-Math.max(0,Math.min(1,(ny-0.55)/0.35));
      let c=mix(pal.D,pal.G,Math.max(0,Math.min(1,v/0.25)));
      if(seaLevel>0.5&&v*gw<seaLevel){     // drowned ground reads as seabed
        const d2=Math.max(0,Math.min(1,(seaLevel-v*gw)/34));
        c=mix(c,[0.05,0.16,0.22],0.35+0.5*d2);
      }
      const rocky=Math.max(steep,Math.max(0,Math.min(1,(v-0.30)/0.20)));
      c=mix(c,pal.R,rocky);
      const snowLine=0.38+0.08*vnoise(uz,x*LANE_W*0.014);
      const snowy=Math.max(0,Math.min(1,(v-snowLine)/0.14))*(1-steep*0.25);
      c=mix(c,pal.S,snowy);
      if(seaLevel>0.5){                    // FOAM: the waterline, made visible
        const fb=Math.max(4.5,seaTop-seaLevel);   // widen to the wave range
        const dw=Math.abs(v*gw-seaLevel);
        if(dw<fb)c=mix(c,[0.86,0.96,1.0],0.6*(1-dw/fb));
      }
      col[i*3]=Math.min(1,c[0]*layerBright);
      col[i*3+1]=Math.min(1,c[1]*layerBright);
      col[i*3+2]=Math.min(1,c[2]*layerBright);
    }
  }
  geo.attributes.color.needsUpdate=true;
}

// ---------------- radar: Battlezone-style sweep, upper left ----------------
// ship at center, ahead is up; blips colored by class, pinned to the rim at
// low alpha when beyond radar range — you always know something is coming
const radarCv=document.getElementById('radar'), rctx=radarCv.getContext('2d');
// world events ECHO on the radar: expanding fading rings at the spot —
// kills red, boss moments gold, pod bursts gold, pickups blue, ship
// damage a red flash at center; a perfect wave flashes the whole bezel
const radarPings=[];
let radarFlash=0;
function radarPing(p,color,big=false){
  radarPings.push({x:p.x,z:p.z,t0:performance.now(),color,big});
  if(radarPings.length>64)radarPings.shift();   // pruning only runs on
}                                              // rendered frames
const RAD_R=66, RAD_RANGE=620;
const RADAR_C={dummy:'#ff5b4b',hunter:'#ff4b3b',tank:'#e04040',shell:'#ff5040',
  pod:'#ffd240',mine:'#ffd240',layer:'#ffd240',boss:'#ff3358',bay:'#ff5040'};
// ---------------- the MUSIC ORB (upper right, mirroring the radar) --------
// A 2D spectrum drawn as a sphere: spokes run pole to pole down the right
// half and are MIRRORED to the left, so the figure is symmetric and reads as
// an orb rather than a star. Bass at the poles, treble at the equator. Three
// latitude ellipses give it the wireframe-globe read, and the whole sphere
// breathes on the overall level.
//
// Two things this shares with the rest of the project on purpose: it is fed
// from the EARS' timeline (see visAn, tapped after the delay), and the spokes
// carry bar BALLISTICS with peak-hold -- fast attack, slow release -- which is
// Model B from the visualizer notes. Straight FFT values flicker; ballistics
// are what make a level look played rather than sampled.
const vizCv=document.getElementById('viz'), vctx=vizCv.getContext('2d');
// 28 spokes (56 mirrored) at ~6.4 degrees apart leaves real gaps between them
// at this radius: 48 read as fur rather than as a spectrum. Wider strokes with
// round caps keep the orb solid at the smaller count.
const VIZ_R=RAD_R, VIZ_N=28, VIZ_R0=Math.round(RAD_R*0.34);
const vizLvl=new Float32Array(VIZ_N), vizPk=new Float32Array(VIZ_N);
const vizBins=new Uint8Array(visAn.frequencyBinCount);
// log-spaced bin ranges, 30Hz..12kHz -- the same span the 48 game bands use
const VIZ_RANGE=(()=>{
  const out=[], nyq=actx.sampleRate/2, n=visAn.frequencyBinCount;
  for(let i=0;i<=VIZ_N;i++){
    const f=FMIN*Math.pow(FMAX/FMIN,i/VIZ_N);
    out.push(Math.min(n-1,Math.max(0,Math.round(f/nyq*n))));
  }
  return out;
})();
function drawViz(now,dt){
  const c=vctx; c.clearRect(0,0,160,160);
  c.save(); c.translate(80,80);
  c.fillStyle='rgba(0,16,4,0.55)';
  c.beginPath(); c.arc(0,0,VIZ_R+5,0,7); c.fill();
  visAn.getByteFrequencyData(vizBins);
  let sum=0;
  for(let i=0;i<VIZ_N;i++){
    let v=0;
    for(let b=VIZ_RANGE[i];b<=Math.max(VIZ_RANGE[i],VIZ_RANGE[i+1]-1);b++)
      if(vizBins[b]>v)v=vizBins[b];
    v=Math.pow(v/255,0.75);                       // lift the quiet detail
    // ballistics: snap up, fall away
    vizLvl[i]+=(v-vizLvl[i])*(v>vizLvl[i]?0.55:Math.min(1,dt*4.5));
    vizPk[i]=Math.max(vizLvl[i],vizPk[i]-dt*0.55);
    sum+=vizLvl[i];
  }
  const lvl=sum/VIZ_N;
  const R=VIZ_R*(0.9+0.1*Math.min(1,lvl*2.2));    // the sphere breathes
  // latitude rings: the wireframe-globe read
  c.strokeStyle='#33ff55'; c.lineWidth=1;
  c.globalAlpha=0.18;
  for(const f of [-0.55,0,0.55]){
    const y=R*f, rx=Math.sqrt(Math.max(0,R*R-y*y));
    c.beginPath(); c.ellipse(0,y,rx,Math.max(1.5,rx*0.26),0,0,7); c.stroke();
  }
  // the spectrum, mirrored about the vertical axis
  for(let i=0;i<VIZ_N;i++){
    const th=-Math.PI/2+(i+0.5)/VIZ_N*Math.PI;    // pole -> equator -> pole
    const ct=Math.cos(th), st=Math.sin(th);
    const t=i/(VIZ_N-1);
    // deep green at the poles (bass) -> pale at the equator (treble)
    const r=0x33+(0xd6-0x33)*t*0.55|0, g=0xff, b=0x55+(0xe0-0x55)*t|0;
    const col=`rgb(${r},${g},${b})`;
    const r1=VIZ_R0+(R-VIZ_R0)*vizLvl[i];
    c.strokeStyle=col; c.lineWidth=3; c.lineCap='round';
    c.globalAlpha=0.35+0.65*vizLvl[i];
    for(const sx of [1,-1]){
      c.beginPath();
      c.moveTo(sx*ct*VIZ_R0,st*VIZ_R0); c.lineTo(sx*ct*r1,st*r1); c.stroke();
    }
    if(vizPk[i]>0.04){                             // peak-hold marks
      const rp=VIZ_R0+(R-VIZ_R0)*vizPk[i];
      c.globalAlpha=0.5*vizPk[i]; c.lineWidth=1.6;
      for(const sx of [1,-1]){
        c.beginPath();
        c.moveTo(sx*ct*rp,st*rp); c.lineTo(sx*ct*(rp+2.5),st*(rp+2.5)); c.stroke();
      }
    }
  }
  // core: the bass, as a small pupil. It used to swell almost to the spoke
  // bases (VIZ_R0) and swallow the middle of the orb; it now stays well inside
  // them so the ring between pupil and spectrum reads as depth.
  const bass=(vizLvl[0]+vizLvl[1]+vizLvl[2])/3;
  c.globalAlpha=0.20+0.45*bass; c.fillStyle='#33ff55'; c.lineCap='butt';
  c.beginPath(); c.arc(0,0,VIZ_R0*(0.22+0.30*bass),0,7); c.fill();
  // bezel, breathing the beat exactly as the radar's does
  c.globalAlpha=0.55+0.25*beatEnv; c.strokeStyle='#33ff55'; c.lineWidth=1.5;
  c.beginPath(); c.arc(0,0,VIZ_R,0,7); c.stroke();
  c.restore();
}
function drawRadar(now){
  const c=rctx; c.clearRect(0,0,160,160);
  c.save(); c.translate(80,80);
  c.fillStyle='rgba(0,16,4,0.55)';
  c.beginPath(); c.arc(0,0,RAD_R+5,0,7); c.fill();
  c.strokeStyle='#33ff55'; c.lineWidth=1.5;
  radarFlash=Math.max(0,radarFlash-0.03);
  c.globalAlpha=0.55+0.25*beatEnv+0.45*radarFlash;   // bezel breathes the beat
  c.beginPath(); c.arc(0,0,RAD_R,0,7); c.stroke();
  c.globalAlpha=0.3;  c.beginPath(); c.arc(0,0,RAD_R*0.5,0,7); c.stroke();
  const a=now*0.0018;                                 // the sweep
  c.globalAlpha=0.45; c.beginPath(); c.moveTo(0,0);
  c.lineTo(Math.cos(a)*RAD_R,Math.sin(a)*RAD_R); c.stroke();
  c.globalAlpha=1; c.fillStyle='#33ff55';             // ship wedge
  c.beginPath(); c.moveTo(0,-5); c.lineTo(4,4); c.lineTo(-4,4);
  c.closePath(); c.fill();
  const sc=RAD_R/RAD_RANGE;
  for(let i=radarPings.length-1;i>=0;i--){          // the event echoes
    const pg=radarPings[i], age=(now-pg.t0)/1000;
    if(age>0.7){radarPings.splice(i,1);continue;}
    let px=(pg.x-shipPos.x)*sc, py=(pg.z+SPEED*age-shipPos.z)*sc;
    const d=Math.hypot(px,py);
    if(d>RAD_R){px*=RAD_R/d;py*=RAD_R/d;}
    c.globalAlpha=(1-age/0.7)*0.9;
    c.strokeStyle=pg.color; c.lineWidth=pg.big?2:1.2;
    c.beginPath(); c.arc(px,py,(pg.big?4:2)+age*(pg.big?22:12),0,7); c.stroke();
  }
  for(const m of enemies){
    const u=m.userData;
    let px=(m.position.x-shipPos.x)*sc, py=(m.position.z-shipPos.z)*sc;
    const d=Math.hypot(px,py);
    if(d>RAD_R){px*=RAD_R/d; py*=RAD_R/d; c.globalAlpha=0.4;}
    else c.globalAlpha=0.95;
    c.fillStyle=u.type==='item'?(u.kind==='red'?'#ff5577':'#55aaff')
               :u.type==='node'?'#55ccff'
               :RADAR_C[u.type]||'#ff5b4b';
    const r=u.type==='boss'?4.5:u.kind==='leader'?3.2
           :(u.type==='shell'||u.type==='mine'||u.type==='item')?1.8:2.6;
    c.fillRect(px-r,py-r,r*2,r*2);
  }
  c.restore();
}

// full HUD blackout during cinematics (letterbox feel): every DOM element
// plus the in-world reticle/web (handled where they're painted)
const hudAll=['hud','score','bigscore','shield','lvl','od','hiscore','radar','touchui']
  .map(id=>document.getElementById(id));
let hudShown=true;

// ---------------- sim loop ----------------
const hud=document.getElementById('hud'), scoreEl=document.getElementById('score');
const bigscoreEl=document.getElementById('bigscore');
let shownScore=0, shownOD=-1;
let last=performance.now(), tickAcc=0, rafAlive=0;
const bootT=performance.now();
function tick(now,doRender=true){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  // QA: ?end=N forces the end screen on WALL-CLOCK time — works even when
  // autoplay is blocked (headed captures of the end screen need no audio)
  if(ENDQA&&!dead&&!finished&&now-bootT>=ENDQA*1000)levelComplete();
  if(playing){
    songT+=dt;
    analyze(dt);
    tickAcc+=dt;
    while(tickAcc>=1/ROWHZ){tickAcc-=1/ROWHZ;advanceRow();}
    mesh.position.z=tickAcc*ROWHZ*ROW_D;
    // level ends when the last HEARD note lands, not when the buffer drains
    if(trackEnded&&!dead&&!finished
       &&songT>=Math.min(lastLoudT+T+0.6,endedAtSongT+T+0.2))levelComplete();
    if(BOSSQA&&!boss&&lastBossT<0&&songT>=BOSSQA&&!dead&&!finished){
      lastBossT=songT;spawnBoss();}       // QA: deterministic boss window
    // earned items materialize on their scheduled OFFBEAT (ears' timeline);
    // a drop still pending when the song ends is quietly cancelled — the
    // runway left is shorter than the ring's collect window
    if(pendingItems.length&&trackEnded)pendingItems.length=0;
    if(pendingItems.length&&!dead&&!finished){
      const tN=actx.currentTime;
      for(let i=pendingItems.length-1;i>=0;i--)
        if(tN>=pendingItems[i].at){
          const it=pendingItems.splice(i,1)[0];
          spawnItem(it.kind,it.pos);
        }
    }


  }
  // ---- autopilot flight (identical to stream.html) ----
  {
    const camSlot=AHEAD+Math.round(CAMBACK/ROW_D);
    // 140wu of climb anticipation (was 80): the spring needs ~1.2s to close a
    // big height step; at 60wu/s that means seeing walls 2+ seconds out
    const s0=Math.max(0,camSlot-Math.ceil(140/ROW_D)), s1=Math.min(ROWS-1,camSlot+2);
    for(let x=0;x<X;x++){
      let m=0;
      for(let s=s0;s<=s1;s++)m=Math.max(m,H[s*X+x]);
      laneProf[x]=m;
    }
    const R=Math.ceil(20/LANE_W);
    for(let x=0;x<X;x++){
      let a=0,n=0;
      for(let k=Math.max(0,x-R);k<=Math.min(X-1,x+R);k++){a+=laneProf[k];n++;}
      laneSm[x]=a/n;
    }
    const cl=Math.max(0,Math.min(X-1,Math.round((camX+W/2)/LANE_W)));
    const REACH=Math.ceil(140/LANE_W), EDGE=Math.ceil(110/LANE_W);
    const cost=x=>{
      const d=Math.min(x,X-1-x);
      return laneSm[x]+0.0022*Math.abs(x-cl)+0.0014*Math.abs(x-X/2)
            +(d<EDGE?(EDGE-d)*0.03:0);
    };
    let best=cl,bc=Infinity;
    for(let x=Math.max(12,cl-REACH);x<=Math.min(X-13,cl+REACH);x++){
      const c=cost(x);
      if(c<bc){bc=c;best=x;}
    }
    if(bc<cost(steerLane)-0.015)steerLane=best;
    const tx=(steerLane+0.5)*LANE_W-W/2;
    [camX,vx]=spring(camX,vx,tx,0.55,dt);
    const lanes=Math.ceil(45/LANE_W), wide=Math.ceil(90/LANE_W),
      cn=Math.max(0,Math.min(X-1,Math.round((camX+W/2)/LANE_W)));
    let m=0,m2=0;
    for(let s=s0;s<=s1;s++)
      for(let x=Math.max(0,cn-wide);x<=Math.min(X-1,cn+wide);x++){
        const h=H[s*X+x];
        if(h>m2)m2=h;
        if(Math.abs(x-cn)<=lanes&&h>m)m=h;
      }
    // over a flooded valley the terrain target goes low, so the sea sets
    // the floor instead — which IS the wave-skim the flood was for
    // aim at the tide's DESTINATION, not its current height: the sea can
    // rise faster than the spring climbs, and being caught by the hard
    // clamp means anticipation failed even though rule 2 held
    const seaAim=Math.max(seaTop,seaTarget+seaAmp*SWSUM);
    const target=Math.max(m*HMAX+CLEAR,m2*HMAX-15,seaAim+CLEAR);
    [camY,vy]=spring(camY,vy,target,target>camY?2.2:0.9,dt);
    // ---- camera mood: what will the ears hear MOODLEAD seconds from now?
    // (sampled from the dry-signal history at songT-(T-MOODLEAD))
    const mt3=songT-(T-MOODLEAD);
    let mVal=0.5;
    for(let i=moodHist.length-1;i>=0;i--)if(moodHist[i].t<=mt3){mVal=moodHist[i].v;break;}
    let lvl=moodLvl;
    if(moodLvl!==2&&mVal>0.62)lvl=2; else if(moodLvl===2&&mVal<0.52)lvl=1;
    if(moodLvl!==0&&mVal<0.30)lvl=0; else if(moodLvl===0&&mVal>0.40)lvl=1;
    if(lvl!==moodLvl){moodHold+=dt;if(moodHold>1.2){moodLvl=lvl;moodHold=0;}}
    else moodHold=0;
    moodCur+=(moodLvl/2-moodCur)*(1-Math.exp(-dt/2.2));   // slow glide = choreography
    camZ=CAMBACK+(0.5-moodCur)*52;   // quiet: +26 pull-back · hot: -26 tight
    // HARD FLOOR (design rule: never crash into terrain) — the spring is a
    // follower; this clamp makes collision impossible while keeping close
    // calls close. Samples under the camera (at its ACTUAL mood-shifted z)
    // and under the ship ahead.
    let gUnder=seaTop;                   // the water IS a floor (rule 2)
    for(let dxl=-12;dxl<=12;dxl+=6)
      gUnder=Math.max(gUnder,terrainH(camX+dxl,camZ),terrainH(camX+dxl,CAMBACK),
        terrainH(camX+dxl,CAMBACK-35),terrainH(camX+dxl,CAMBACK-70));
    const floorY=gUnder+22;
    if(camY<floorY){camY=floorY;if(vy<0)vy=0;floorSaves++;}
    cam.position.x=camX; cam.position.y=camY; cam.position.z=camZ;
    // one-shots: FOV punch decays over ~a beat; the boss-arrival gaze
    // ramps while a boss flies in and releases once it holds
    if(boss&&boss.userData.state==='in'){gazeTgt.copy(boss.position);
      bossGaze=Math.min(1,bossGaze+dt*0.8);}
    else bossGaze=Math.max(0,bossGaze-dt*0.6);
    fovKick=Math.max(0,fovKick-dt*1.8);
    // LEVEL COMPLETE: the camera holds its breath — a slow wide settle
    // that eases back to nominal while the mothership comes for you
    if(finished&&!dead)cmpSettle=Math.min(1,cmpSettle+dt*0.7);
    const fovT=55+fovKick*fovKick*8+bossGaze*3-cmpSettle*6;
    if(Math.abs(cam.fov-fovT)>0.01){cam.fov=fovT;cam.updateProjectionMatrix();}
    // gaze: quiet lifts the eyes to the horizon, intensity buries them in
    // the deck rush; bank gain leans harder into turns when the music is hot
    mv1.set(camX*0.6,camY-9-moodCur*21,-HORIZON);
    if(bossGaze>0.001)mv1.lerp(gazeTgt,bossGaze*0.4);   // lean at the arrival
    cam.lookAt(mv1);
    cam.rotateZ(Math.max(-0.18,Math.min(0.18,-vx*(0.004+moodCur*0.005))));
    // impact shake: fast decaying positional + roll jitter on damage
    if(shake>0){
      shake=Math.max(0,shake-dt*2.8);
      const s=shake*shake*7;
      cam.position.x+=(hash(now,1)*2-1)*s;
      cam.position.y+=(hash(now,2)*2-1)*s;
      cam.rotateZ((hash(now,3)*2-1)*shake*0.05);
    }
  }
  // ---- targeting layer ----
  const tNow=actx.currentTime;
  {  // beat clock: heard onsets fire it; FP tempo interpolates the gaps
    let hit=false;
    for(const h of heardOnsets)if(h>prevBeatChk&&h<=tNow){hit=true;break;}
    const bi=FP&&FP.tempo?60/FP.tempo:0;
    if(!hit&&bi&&playing&&!finished&&tNow-lastBeatT>=bi)hit=true;
    if(hit){beatEnv=1;lastBeatT=tNow;}
    else beatEnv*=Math.exp(-dt/0.22);
    prevBeatChk=tNow;
  }
  // Rez model: the mouse moves ONLY the cursor — the ship NEVER follows the
  // reticle. The ship rides the rail (camera frame) with flight-driven sway;
  // the reticle roams the WHOLE screen (weapon-cone clamp removed, user call).
  const k=1-Math.exp(-dt/Math.max(0.02,P.FOLLOW));
  shipPos.x+=(camX-shipPos.x)*k;                        // lags the autopilot
  // altitude tracks the camera FAST (fixed tau) — the lateral sway is the
  // flight feel; vertical lag just shoves the ship off the screen bottom
  const ky=1-Math.exp(-dt/0.06);
  shipPos.y+=(camY-16+Math.sin(tNow*1.3)*2.5-shipPos.y)*ky;
  shipPos.z=CAMBACK-70;                                 // ~13 deg below view axis
  ship.position.copy(shipPos);
  ship.rotation.z=Math.max(-0.5,Math.min(0.5,-vx*0.02));    // bank with flight
  // ---- cinematics: only the MESHES move — shipPos/flight/sim untouched ----
  if(cine){
    // WALL-CLOCK, not accumulated dt: throttled rAF (occluded windows) ran
    // the old dt-clock at ~0.2x and the pickup never finished
    let t=(now-cine.t0)/1000;
    if(CINEQA&&cine.phase==='drop')t=Math.min(t,CINEQA);
    cine.t=t;
    if(cine.phase==='drop'){
      // approach -> hold -> the ship visibly LOWERS out of the bay -> depart
      const ap=ez(t/2.4);
      const dy=95-69*ap, dz=-300+290*ap;
      mother.position.set(shipPos.x,shipPos.y+dy,shipPos.z+dz);
      if(t<3.0){                                    // docked, riding down
        ship.position.set(mother.position.x,mother.position.y-9,mother.position.z);
      }else if(t<4.2){                              // the drop itself, in view
        if(!cine.rel){cine.rel=1;whoosh(tNow,0.5,0.28);}
        const f=ez((t-3.0)/1.2);
        ship.position.set(
          mother.position.x+(shipPos.x-mother.position.x)*f,
          mother.position.y-9+(shipPos.y-(mother.position.y-9))*f,
          mother.position.z+(shipPos.z-mother.position.z)*f);
        emit(ship.position.x,ship.position.y+2,ship.position.z,0.4,0.75,1,0.3,1.5);
      }
      motherBay.material.opacity=t<4.2?0.55+0.4*Math.sin(t*9):0;  // bay light
      if(t>4.2){const u=ez((t-4.2)/2.2);            // mother departs up-ahead
        mother.position.y+=u*u*220; mother.position.z-=u*u*420;}
      if(t>6.4){cine=null;mother.visible=false;}
    }else{                                          // pickup
      const ap=ez(t/2.2);
      mother.position.set(shipPos.x,shipPos.y+150-120*ap,shipPos.z-260+260*ap);
      motherBay.material.opacity=(t>1.6&&t<3.8)?0.55+0.4*Math.sin(t*9):0;
      if(t>2.2&&t<3.4){const f=ez((t-2.2)/1.2);     // tractor the ship up, in view
        ship.position.set(shipPos.x,
          shipPos.y+(mother.position.y-9-shipPos.y)*f,shipPos.z);
        emit(ship.position.x,ship.position.y-3,ship.position.z,0.4,0.75,1,0.3,1.5);
      }
      if(t>=3.4&&!cine.dock){cine.dock=1;           // SWALLOWED: flash + gone
        ship.visible=false;
        for(let i=0;i<14;i++)emit(mother.position.x,mother.position.y-8,
          mother.position.z,0.5,0.8,1,0.45,4);
        tone(nt(7)*2,tNow,0.3,'triangle',0.2);}
      if(t>=3.4){const u=ez((t-3.4)/1.4);
        mother.position.y+=u*u*260; mother.position.z-=u*u*480;}
      if(t>4.9){cine=null;mother.visible=false;
        if(cineEnd){cineEnd();cineEnd=null;}}
    }
    mother.rotation.z=Math.sin(t*0.9)*0.03;         // gentle hover roll
  }
  // engine flicker: two incommensurate sines = organic thrust shimmer
  if(exPlume){
    const fl=(0.75+0.2*Math.sin(now*0.045)+0.1*Math.sin(now*0.113))
            *(1+0.3*beatEnv);                       // the plume rides the beat
    const on=playing&&!dead?1:0.3;
