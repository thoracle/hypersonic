      const lc=(u.type==='item'||u.type==='node')?FRIENDLY:TAGLOCK;
      if(u.claimed){tm.color.setHex(lc);tm.opacity=0.6+0.35*Math.sin(tNow*10);}
      else if(u.queued){tm.color.setHex(lc);tm.opacity=0.95;}
      else{tm.color.setHex(0xffffff);tm.opacity=0.45;}}
    // the weapons-range boundary is VISIBLE on the target: ghosted beyond
    // range, popping to full brightness (flash + blip) on crossing — "lit up"
    // always means "lockable", no hover needed to find out
    if(!u.inRange&&m.position.z>=WEAPON_Z){
      u.inRange=true; u.flash=Math.max(u.flash||0,0.5);
      m.material.opacity=1;
      if(u.bzOn)m.traverse(n=>{if(n.userData.bzw)n.userData.bzw.material.opacity=1;});
      ensureTag(m);                       // in-range enemies wear a white box
      tone(1568,tNow,0.05,'triangle',0.07);
    }
    u.vis=u.inRange&&u.state!=='out'&&losClear(m.position)   // warping = untargetable
      &&!u.sub                                       // under water: no locks
      &&!(u.type==='boss'&&u.bays&&u.bays.length);   // shielded hull: no locks
    if(u.vis)u.everVis=true;
    // RULE 1, enforced LIVE: a radar blip the player can never target is a
    // spawn-placement violation. In weapons range 4s and never once visible
    // -> quietly unspawn (no escape, wave slot refunded) and count the cull:
    // every ghostCull in telemetry is a spawn-proof leak to tune against.
    if(playing&&u.inRange&&!u.everVis&&u.type!=='boss'&&u.type!=='bay'){
      u.ghostT=(u.ghostT||0)+dt;
      if(u.ghostT>4){
        if(!u.noWave)waveSpawned=Math.max(0,waveSpawned-1);
        if(u.type==='item')itemsSpawned--;   // an uncollectable ring is refunded
        if(u.type==='node')nodesSpawned--;   // an unanalyzable node likewise
        ghostCulls[u.type]=(ghostCulls[u.type]||0)+1;
        dropEnemy(m);continue;
      }
    }
    v3.copy(m.position).project(cam);
    const sx=(v3.x+1)/2*innerWidth, sy=(1-v3.y)/2*innerHeight;
    const d=Math.hypot(sx-aimSX,sy-aimSY);
    if(d<P.MAGNET*1.6){
      if(!u.vis)hoverBlocked=true;
      else if(u.type==='item'||u.type==='node')hoverItem=true;   // blue-family
      else hoverNear=true;                      // a hostile under the reticle
    }
    if(u.vis&&d<P.MAGNET&&d<hoverAnyD){hoverAnyD=d;hoverAnyM=m;}  // press target: nearest under reticle
    if(playing&&holdLock&&u.vis&&(!u.queued&&!u.claimed||u.hp>1)&&!pendingSet.has(m)
       &&queue.length+pending.length<P.QUEUE_MAX&&d<P.MAGNET){
      pending.push(m);pendingSet.add(m);           // committed by the sweep,
    }                                              // granted on the music grid
  }
  // lock dispenser: grants IMMEDIATELY on the LOCKMS pacing floor — the
  // sweep must feel instant (Rez locks as the cursor overlaps); musical
  // quantization lives on the VOLLEY launch, not here
  if(playing&&holdLock&&pending.length&&queue.length<P.QUEUE_MAX
     &&!(P.FIRELOCK>0.5&&tNow<fireUntil)){
    if(tNow-lastLockAt>=P.LOCKMS/1000){
      const m=pending.shift(); pendingSet.delete(m);
      // re-check at grant time: it may have slipped behind a ridge or still
      // be outside weapons range since the sweep committed it
      if(enemies.has(m)&&m.userData.vis){
        lastLockAt=tNow;
        queue.push(m); setQueued(m,true); drawDigit(queue.length); lockFlash=1;
        // stacked locks grow the tag so the pile-on reads on the target
        const stack=queue.reduce((n,x)=>n+(x===m),0);
        if(m.userData.tag)m.userData.tag.scale.setScalar((m.userData.tagBase||7)*(1+0.18*(stack-1)));
        duck(tNow,0.14);
        // lock tones an octave up, in the track's key, TICK on the 1/16 grid
        // (the grant itself stays instant — feel and sound are split)
        vtone(nt(Math.min(queue.length-1,7))*2,tick16(tNow),0.14,0.22);
      }
    }
  }
  // reticle paint-state (hidden during cinematics — no weapons on the dock)
  reticle.visible=!cine; web.visible=!cine;
  const hudWant=!cine;                       // cutscenes get a clean frame
  if(hudWant!==hudShown){hudShown=hudWant;
    for(const e of hudAll)e.style.visibility=hudWant?'visible':'hidden';}
  const targetScale=(holdLock||hoverNear||hoverItem||queue.length>0||pending.length>0)?1.25:1.0;
  reticleScale+=(targetScale-reticleScale)*(1-Math.exp(-dt/0.08));
  lockFlash=Math.max(0,lockFlash-dt*5);
  reticle.scale.setScalar(P.RSIZE*reticleScale);
  retMat.opacity=0.85+lockFlash*0.15;
  // WHITE = no lock available under the reticle · RED = over a lockable
  // HOSTILE (and the lock-grant pop) · ITEM-BLUE = only a pickup ring under
  // it (a hostile in the mix wins the tie — threat outranks reward)
  retMat.color.setHex(hoverNear?TAGLOCK
    :hoverItem?FRIENDLY
    :lockFlash>0.4?TAGLOCK:0xffffff);
  // lock web
  let wi=0;
  for(const m of queue){
    webPos[wi*6+0]=shipPos.x;webPos[wi*6+1]=shipPos.y;webPos[wi*6+2]=shipPos.z;
    webPos[wi*6+3]=m.position.x;webPos[wi*6+4]=m.position.y;webPos[wi*6+5]=m.position.z;
    wi++;
  }
  webGeo.setDrawRange(0,wi*2);
  webGeo.attributes.position.needsUpdate=true;
  web.material.opacity=0.3+0.2*Math.sin(now/90);
  // missiles: steered pursuit with a proximity fuse
  for(const mis of missiles){
    if(!mis.launched){
      if(tNow<mis.launchAt)continue;
      mis.launched=true;mis.head.visible=true;
      mis.pos.copy(shipPos);
      // radial fan by volley index: bloom outward before the homing bites
      const a=(mis.idx%8)/8*Math.PI*2;
      mis.v.set(Math.cos(a)*70,35+Math.sin(a)*45,-50);
      // telemetry snapshot at launch: range + bearing/elevation off the
      // ship's boresight (-z), target class
      {const tp=mis.target.position, tu2=mis.target.userData;
       const dx=tp.x-mis.pos.x, dy=tp.y-mis.pos.y, dz=tp.z-mis.pos.z;
       mis.rec={t:+songT.toFixed(2),od:mis.od,
         type:tu2.type==='hunter'?tu2.kind
             :tu2.type==='tank'?'tank':tu2.type==='shell'?'shell'
             :tu2.type==='boss'?(tu2.genus||'carrier')
             :tu2.type==='item'?('item-'+tu2.kind)
             :tu2.type==='node'?'node'
             :['pod','layer','mine','bay'].includes(tu2.type)?tu2.type
             :tu2.kind,
         dist:+Math.hypot(dx,dy,dz).toFixed(1),
         az:+(Math.atan2(dx,-dz)*180/Math.PI).toFixed(1),
         el:+(Math.atan2(dy,Math.hypot(dx,dz))*180/Math.PI).toFixed(1)};
       // lifetime scales with launch range: a lock the game GRANTS must be a
       // lock the missile can SERVICE (design rule: always a valid shot) —
       // the flat 3s fuse made max-range locks physically unhittable
       mis.ttl=Math.max(3,1.0+mis.rec.dist/170);
       if(TRACE){mis.rec.tr=[];mis.trAcc=0;}}   // flight trace: dist/speed 4x/s
    }
    mis.age+=dt;
    const tgt=mis.target.position, tu=mis.target.userData;
    const d0=mis.pos.distanceTo(tgt);
    // LEAD the target: pure pursuit tail-chases and orbits; aim where the
    // target will be (hunters fly their boids velocity, dummies ride the
    // scroll and sink)
    if(tu.type==='hunter'||tu.type==='shell')mv2.copy(tu.v);
    else if(tu.type==='tank')mv2.set(0,0,SPEED);   // rides the scroll only
    else if(tu.type==='layer')mv2.set(tu.vx||0,0,SPEED*0.75);
    else if(tu.type==='boss'||tu.type==='bay')mv2.set(0,0,0);  // sky-holders:
      // they do NOT ride the scroll — phantom scroll-lead was parking bay
      // shots ~35wu behind orbiting shards (9 terrain impacts on qa-funk)
    else mv2.set(0,-(tu.sink||0),SPEED);           // pods/mines ride the scroll
    // lead FADES OUT inside 130wu and is zero by 50wu: lead is intercept
    // geometry for the long chase — on final approach it becomes a phantom
    // aim point ~13wu from the target that parks missiles JUST outside the
    // fuse (flight traces showed every miss stalling at 17-27wu)
    const leadT=Math.min(0.6,Math.max(0,d0-50)/(MSPD*0.8));
    mv1.copy(tgt).addScaledVector(mv2,leadT).sub(mis.pos);
    // seek with GAIN then cap: the raw steering error |desired-v| tops out
    // ~2*MSPD=380, so a 5000 cap never engaged — true turn authority was
    // ~250 wu/s^2 (radius ~120wu!), the root of every flyby miss. The gain
    // makes the cap the real authority: radius = MSPD^2/5000 ~ 7wu.
    mv1.normalize().multiplyScalar(MSPD).sub(mis.v);
    mv1.multiplyScalar(24);
    const f=mis.age<Math.max(0.08,P.HOMING)*0.5?260:5000;
    if(mv1.length()>f)mv1.setLength(f);
    // terrain avoidance (same trick as the hunters): climb when the ground
    // ahead crowds the flight path — but NOT on final approach, where the
    // target itself may be hugging the deck
    // terrain avoidance ONLY during cruise — inside 140wu the missile is in
    // its attack dive and the shove was bending final approach 15-20wu wide
    // (the flight-trace stall at 17-27wu; force here rivals the homing force)
    if(d0>140){
      const clr=mis.pos.y-Math.max(
        groundY(mis.pos.x,mis.pos.z),
        groundY(mis.pos.x+mis.v.x*0.35,mis.pos.z+mis.v.z*0.35));
      if(clr<18){mv1.y+=(18-clr)*220;if(mis.rec)mis.rec.avN=(mis.rec.avN||0)+1;}
    }
    mis.v.addScaledVector(mv1,dt);
    if(mis.v.length()>MSPD)mis.v.setLength(MSPD);
    mis.pos.addScaledVector(mis.v,dt);
    // swept fuse: min of before/after distance catches tick fly-throughs
    const dist=Math.min(d0,mis.pos.distanceTo(tgt));
    if(mis.rec){
      mis.rec.cd=Math.min(mis.rec.cd??1e9,+dist.toFixed(1));  // closest approach
      if(TRACE){mis.trAcc+=dt;
        if(mis.trAcc>=0.25){mis.trAcc=0;
          mis.rec.tr.push((dist|0)+'/'+(mis.v.length()|0));}}}
    mis.head.position.copy(mis.pos);
    mis.head.scale.setScalar(10*(1+0.18*Math.sin(now*0.025+mis.idx*1.7)));  // orb pulse
    emit(mis.pos.x,mis.pos.y,mis.pos.z,0.5,1,0.6,0.45,1.1);   // plasma wake
    emit(mis.pos.x,mis.pos.y,mis.pos.z,0.9,1,0.9,0.25,0.6);
    // terrain impact: detonate with SPLASH — anything near the blast dies
    const ground=groundY(mis.pos.x,mis.pos.z);
    if(mis.pos.y<=ground+1.5){
      scene.remove(mis.head);missiles.delete(mis);
      recordShot(mis,'terrain');
      boom(mis.pos.clone(),true);
      const wet=mis.pos.y<=seaTop+2;
      popup(mis.pos,'SPLASH',wet?'#7fd4ff':'#ffcf7a');
      explosion(tNow,1.5,mis.pos.distanceTo(shipPos));  // dirt-throwing WHOMP
      if(wet)for(let i=0;i<14;i++)          // a real column of spray
        emit(mis.pos.x,seaTop+2,mis.pos.z,0.7,0.9,1,0.5,5);
      for(const e2 of [...enemies])
        if(e2.position.distanceTo(mis.pos)<30)hitEnemy(e2,tNow);
      releaseClaim(mis,tNow);      // its own target survived the splash
      continue;
    }
    const fuse=tu.type==='boss'?42:18;   // bulk targets arm a wider fuse
    if(dist<fuse||mis.age>(mis.ttl||3)){
      scene.remove(mis.head);missiles.delete(mis);
      if(dist<fuse&&enemies.has(mis.target)){
        recordShot(mis,'hit');
        vtone(echoNote(mis.idx),tNow,0.1,0.18);   // the kill sings the song
        hitEnemy(mis.target,tNow);       // the kill/chip itself now booms
        // splash: every detonation shreds anything packed around the impact
        // — tight hunter flocks chain off a single hit (the direct target is
        // excluded: a surviving sponge must not be double-chipped)
        for(const e2 of [...enemies])
          if(e2!==mis.target&&e2.position.distanceTo(mis.pos)<22)hitEnemy(e2,tNow);
      }else if(dist<fuse){
        // arrived where the target died — stacked locks detonate anyway,
        // each with full splash: pile-on locks become area denial
        recordShot(mis,'corpse');
        boom(mis.pos.clone());
        explosion(tNow,0.6,mis.pos.distanceTo(shipPos));
        for(const e2 of [...enemies])
          if(e2.position.distanceTo(mis.pos)<22)hitEnemy(e2,tNow);
      }
      else{                                       // timed out: burn-out puff,
        if(mis.rec&&enemies.has(mis.target))      // final miss distance: the
          mis.rec.md=+dist.toFixed(1);            // diagnostic that names why
        recordShot(mis,'miss');
        boom(mis.pos.clone());                    // never a silent vanish
        popup(mis.pos,'MISS','#ff8866');
        releaseClaim(mis,tNow);
      }
    }
  }
  updateSea(dt,now);
  updateParticles(dt);
  for(const sp of pops){
    sp.userData.age+=dt;
    sp.position.y+=14*dt;
    sp.material.opacity=Math.max(0,1-sp.userData.age/0.9);
    if(sp.userData.age>=0.9){scene.remove(sp);sp.material.map.dispose();
      sp.material.dispose();pops.delete(sp);}
  }
  for(const b2 of booms){b2.userData.age+=dt;const s=1+b2.userData.age*(b2.userData.grow||60);
    b2.scale.setScalar(s);b2.material.opacity=Math.max(0,1-b2.userData.age*2.4);
    if(b2.material.opacity<=0){scene.remove(b2);booms.delete(b2);}}
  // section banner: the boundary detected T seconds ago is NOW reaching the
  // ears — announce it where the jingle (scheduled at detection) is landing
  if(pendingSec&&songT>=pendingSec.at){
    popup(mv1.set(camX,camY+38,camZ-230),pendingSec.txt,'#9fe8ff',2.2);
    // an intense section reaching the ears IS the drop: punch the FOV
    if(pendingSec.cls==='surge'||pendingSec.cls==='bloom')fovKick=1;
    pendingSec=null;
  }
  // wave gate: field fully clear (kills + escapes, volleys resolved) -> next
  // wave. Heat tracks the rolling clear-rate: hot players get denser, livelier
  // waves; a fully-escaped wave devolves the ship one form (Rez's loop)
  if(playing&&waveSpawned>0&&!anyHostile&&missiles.size===0){
    const clearRate=waveKills/waveSpawned;
    heat=0.7*heat+0.3*clearRate;
    if(clearRate===1){score+=100;                      // perfect wave bonus:
      [0,4,7,12].forEach((d,j)=>vtone(nt(d%8)*2,tNow+0.15+j*0.06,0.16,0.2));
      tone(nt(7)*4,tNow+0.45,0.3,'triangle',0.12);     // a real SUCCESS riff
      radarFlash=1;}                                   // bezel flash: perfect
    // a PERFECT wave hangs a BLUE ring ahead (the evolution economy)
    if(clearRate===1||ITEMQA)dropItem('blue',null);
    if(clearRate===0&&shipLevel>0){shipLevel--;setShipForm();
      tone(220,tNow,0.4,'sawtooth',0.18,-120);}
    waveSpawned=0; waveKills=0; waveNum++;
    [0,4,7].forEach((d,i)=>vtone(nt(d)*2,tNow+i*0.07,0.15,0.15));
  }

  // QA autoplayer (?bot=1): sweeps toward the nearest lockable target at a
  // human-ish speed, holds to build the queue, releases when swept dry or
  // full. Uses the exact player code paths — a repeatable telemetry baseline.
  if(BOT&&playing&&!dead&&!finished){
    let best=null,bd=1e9,anyLockable=false;
    for(const m of enemies){
      if(!m.userData.vis)continue;
      v3.copy(m.position).project(cam);
      const sx=(v3.x+1)/2*innerWidth, sy=(1-v3.y)/2*innerHeight;
      if(!m.userData.queued&&!m.userData.claimed){
        anyLockable=true;
        const d=Math.hypot(sx-mouse.x*innerWidth,sy-mouse.y*innerHeight);
        if(d<bd){bd=d;best={sx,sy};}
      }
    }
    if(best){
      const spd=1.4*dt;                    // ~0.7s to cross the screen
      mouse.x+=Math.max(-spd,Math.min(spd,best.sx/innerWidth-mouse.x));
      mouse.y+=Math.max(-spd,Math.min(spd,best.sy/innerHeight-mouse.y));
      if(!holdLock){holdLock=true;holdSrc='bot';}
    }
    if(holdLock&&holdSrc==='bot'&&queue.length>0
       &&(!anyLockable||queue.length>=P.QUEUE_MAX)){
      holdLock=false;holdSrc=null;fireQueue();
    }
  }
  if(doRender){renderer.render(scene,cam);drawRadar(now);drawViz(now,dt);}
  hud.textContent=`speed ${SPEED}wu/s  delay ${T}s  horizon ${HORIZON}wu\n`
    +`cand ${(candRate.length/5).toFixed(1)}/s  sel ${(selRate.length/5).toFixed(1)}/s  `
    +`enemies ${enemies.size}  wave ${waveSpawned}/${wavePlan?wavePlan.n:'-'}`
    +`${wavePlan&&wavePlan.hunters?` (${waveHunters}/${wavePlan.hunters}h)`:''}`
    +`${wavePlan&&wavePlan.tanks?` (${waveTanks}/${wavePlan.tanks}t)`:''}`
    +`${wavePlan&&wavePlan.pods?` (${wavePods}/${wavePlan.pods}p)`:''}`
    +`${wavePlan&&wavePlan.layers?` (${waveLayers}/${wavePlan.layers}m)`:''}`
    +`  sec ${secIdx}:${curSecCls} nov ${lastNov.toFixed(2)}`
    +`  cam ${['wide','mid','tight'][moodLvl]}`
    +`  fp ${FP?FP.biome+' p'+FP.percFrac+' '+FP.tempo+'bpm '+FP.genus:'reading…'}`
    +`  sea ${seaLevel.toFixed(0)}/${seaTarget.toFixed(0)}${boss&&boss.userData.genus==='leviathan'
        ?(boss.userData.sub?' [LEV UNDER]':' [LEV UP]'):''}\n`
    +`MAGNET ${P.MAGNET} FOLLOW ${P.FOLLOW.toFixed(2)} HOMING ${P.HOMING.toFixed(2)} `
    +`CASCADE ${P.CASCADE} RSIZE ${P.RSIZE.toFixed(1)} LOCKMS ${P.LOCKMS} FIRELOCK ${P.FIRELOCK}\n`
    +`keys: [ ] - = , . ; ' o O j J p · v view (retro/wire/shaded) · HOLD = lock sweep, release = FIRE\n`
    +`tap space/2nd button while holding = single lock on hovered target (any state) · e overdrive`;
  scoreEl.textContent=`WAVE ${waveNum}  CHAIN x${chain}  BEST x${bestChain}  LV ${shipLevel+1}  LY ${layerLvl}  RC x${rhythm}\nQUEUE ${queue.length}/${P.QUEUE_MAX}  OD x${overdrives}  KILLS ${kills}  ESC ${escapes}  IT ${itemsGot}/${itemsSpawned}  DN ${nodesOpened}/${nodesSpawned}`
    +(boss?`\n${boss.userData.name} ${boss.userData.hp} HP`
      +(boss.userData.bays.length?` · ${boss.userData.bays.length} BAYS`:''):'');
  if(overdrives!==shownOD){setOD(shownOD>=0&&overdrives>shownOD);shownOD=overdrives;}
  if(score!==shownScore){
    shownScore=score;
    bigscoreEl.textContent=fmt(score);
    bigscoreEl.animate(
      [{transform:'translateX(-50%) scale(1.3)'},{transform:'translateX(-50%) scale(1)'}],
      {duration:180,easing:'ease-out'});
    if(score>hiScore){hiScore=score;
      hiEl.textContent='HI '+fmt(hiScore);}
  }
  // shield: Halo recharge — quiet delay after the last hit, then refill
  if(!dead&&shield<SHIELD_MAX&&tNow-lastHitAt>TU.RECH_DELAY){
    if(!rechargeOn){rechargeOn=true;     // recharge kicks in: a soft shimmer
      tone(1568,tNow,0.25,'sine',0.08);tone(1976,tNow+0.1,0.3,'sine',0.07);}
    shield=Math.min(SHIELD_MAX,shield+TU.RECH_RATE*dt);
    if(shield===SHIELD_MAX)tone(1320,tNow,0.15,'triangle',0.15);  // full chirp
  }
  // shield bubble: visible while the hit-glow lasts, swelling as it fades
  if(shieldGlow>0){
    shieldGlow=Math.max(0,shieldGlow-dt*2.2);
    const bsc=1+(1-shieldGlow)*0.25, bvis=!dead&&shieldGlow>0.01;
    bubble.position.copy(shipPos); bubbleWire.position.copy(shipPos);
    bubble.scale.setScalar(bsc); bubbleWire.scale.setScalar(bsc*1.02);
    bubbleWire.rotation.y+=dt*0.9;                 // slow spin sells the 3D
    bubble.material.opacity=shieldGlow*0.22;
    bubbleWire.material.opacity=shieldGlow*0.55;
    bubble.visible=bubbleWire.visible=bvis;
  }else bubble.visible=bubbleWire.visible=false;
  const sp2=shield/SHIELD_MAX;
  shieldFill.style.width=(sp2*100).toFixed(1)+'%';
  shieldFill.style.background=sp2>0.5?'#33ff55':(sp2>0.25?'#ffbb33':'#ff4433');
  shieldFill.style.boxShadow='0 0 8px '+(sp2>0.5?'#33ff55':(sp2>0.25?'#ffbb33':'#ff4433'));
}

// ---------------- tracks ----------------
let starting=false;
async function startTrack(src){
  if(starting)return; starting=true;
  try{
    if(MUTEQA)actx.resume().catch(()=>{});   // suspended ctx is fine muted:
    else                                     // the sim runs on dt, not audio
    await Promise.race([actx.resume(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('autoplay blocked — click the page')),2000))]);
    el.src=src; if(MUTEQA)el.muted=true;
    await el.play(); playing=true;
    startCine('drop');            // masks the spawn-dead first T seconds
    const mt=src.match(/tracks\/(.+)$/); curTrack=mt?mt[1]:null;
    refreshHi();
  }catch(e){ console.warn('start failed',e.message); }
  starting=false;
}

// from either end screen. After a run, selection reloads the page so every

const picker=document.getElementById('picker');
function showPicker(){picker.style.display='flex';}
function hidePicker(){picker.style.display='none';}
// The shipped songs. The qa-* tones are synthetic fixtures for the QA rig and
// are NOT part of a distribution build -- tools/bundle.py empties QA_TRACKS.
const GAME_TRACKS=['ready-aim-fire.mp3','heavy-interlude.mp3','cut-and-run.mp3',
                   'hard-boiled.mp3','severe-tire-damage.mp3'];
const QA_TRACKS=['qa-thrash.mp3','qa-drift.mp3','qa-funk.mp3','qa-crescendo.mp3'];
for(const t of [...GAME_TRACKS,...QA_TRACKS]){
  const b=document.createElement('button');b.textContent=t.replace(/\.mp3$/,'');
  b.onclick=async()=>{

    await startTrack('tracks/'+t); hidePicker();
  };
  picker.append(b);
}
const fb=document.createElement('button');fb.textContent='open file…';
const fi=document.createElement('input');fi.type='file';fi.accept='audio/*';fi.style.display='none';
fb.onclick=()=>fi.click();
fi.onchange=async()=>{if(!fi.files[0])return;
  if(playing||dead||finished){restart(null);return;}   // clean slate first
  await startTrack(URL.createObjectURL(fi.files[0])); hidePicker();};
picker.append(fb,fi);
window.__dbg={start:t=>startTrack('tracks/'+t),
  state:()=>({playing,songT,globalRow,stamps:stamps.length,enemies:enemies.size,
    items:itemsGot+'/'+itemsSpawned,
    nodes:nodesOpened+'/'+nodesSpawned,layer:layerLvl,
    queue:queue.length,score,kills,escapes,shield:Math.round(shield),dead,
    finished,cine:cine?{p:cine.phase,t:+cine.t.toFixed(2)}:null,
    cineEnd:!!cineEnd})};
// QA: ?shots=1 posts canvas frames at 20s/45s to /analysis. ?shots=20,45,80
// names its own capture times, and every file carries the TRACK, so a gallery
// can be collected across tracks without each run overwriting the last.
// The ORB is captured alongside the world: it is a canvas, which makes it the
// one piece of the HUD a headless run can actually see (the rest is DOM).
if(qs.get('shots')){
  const q=qs.get('shots');
  const times=/[0-9]/.test(q)&&q!=='1'
    ? q.split(',').map(Number).filter(n=>n>0) : [20,45];
  for(const at of times){
    const poll=setInterval(()=>{
      if(songT>=at){clearInterval(poll);
        const tag=(curTrack||'custom').replace(/\.mp3$/,'')+'-'+at;
        renderer.domElement.toBlob(bl=>bl&&
          qaPost('/analysis?name=shot-'+tag+'.png',{method:'POST',body:bl}));
        vizCv.toBlob(bl=>bl&&
          qaPost('/analysis?name=orb-'+tag+'.png',{method:'POST',body:bl}));
        qaPost('/log',{method:'POST',body:JSON.stringify({runId:'game-qa',at,
          state:__dbg.state(),missiles:missiles.size,pending:pending.length,fireCount,lastInput})});}
    },500);
  }
}
const wantTrack=qs.get('track');
if(!wantTrack)showPicker();
if(wantTrack){
  // retry on gesture ONLY if autoplay was blocked — a click is the fire
  // button here, it must never restart a playing track
  const go=()=>{if(!playing)startTrack('tracks/'+wantTrack);
    removeEventListener('pointerdown',go);removeEventListener('keydown',go);};
  addEventListener('pointerdown',go);addEventListener('keydown',go);
  startTrack('tracks/'+wantTrack);
}
</script>
